- id: asana-t01
  prompt: >-
    Add a task called "Draft launch checklist" to our Website Redesign project, due December 1, 2026.
  split: practice
  in_intent: true
  expected_calls:
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Draft launch checklist, projects: ['1205000000000101'], due_on: '2026-12-01'}}
  solution:
    - server: asana
      operation: create_task
      arguments: {data: {name: Draft launch checklist, projects: ['1205000000000101'], due_on: '2026-12-01'}}
  responses:
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1200000000000001', name: Acme Corp, resource_type: workspace}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1205000000000101', name: Website Redesign, resource_type: project}, {gid: '1205000000000102', name: Mobile App Redesign, resource_type: project}, {gid: '1205000000000103', name: Website Redesign 2025 (old), resource_type: project}]}
    - server: asana
      method: GET
      path: /workspaces/{workspace_gid}/projects
      body: {data: [{gid: '1205000000000101', name: Website Redesign, resource_type: project}, {gid: '1205000000000102', name: Mobile App Redesign, resource_type: project}, {gid: '1205000000000103', name: Website Redesign 2025 (old), resource_type: project}]}

