# Generic: intent-agnostic cleanup, hiding a header parameter no request needs and clarifying vague tools.
servers:
  petstore:
    operations:
      deletePet:
        tool:
          params_strategy: merge
          params:
            api_key: { hidden: true }
      updatePetWithForm:
        tool:
          description: Update a pet's name and/or status (available, pending, sold) by pet id without sending the full pet record.
          params_strategy: merge
          params:
            status:
              type: string
              enum: [available, pending, sold]
