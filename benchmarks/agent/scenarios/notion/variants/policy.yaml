# The policy alone, keeping what reads pages, blocks, and databases, adds and edits content,
# and updates database entries.
servers:
  notion:
    policy:
      allow:
        - retrieveAPage
        - updatePageProperties
        - retrieveAPagePropertyItem
        - retrieveABlock
        - retrieveBlockChildren
        - appendBlockChildren
        - updateABlock
        - retrieveADatabase
        - queryADatabase
