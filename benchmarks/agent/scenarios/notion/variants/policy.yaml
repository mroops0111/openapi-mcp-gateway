# Policy only: read/navigate pages, blocks and databases, append/edit content, update database entries.
servers:
  notion:
    policy:
      allow:
        - retrieveAPage
        - updatePageProperties
        - retrieveAPagePropertyItem
        - retrieveABlock
        - retrieveBlockChildren
        - appendBlockChildren
        - updateABlock
        - retrieveADatabase
        - queryADatabase
