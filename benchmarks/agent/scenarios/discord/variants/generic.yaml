# A config that knows nothing of the intent,
# with dynamic exposure for the whole Discord API and notes that steer the model away from deprecated duplicates.
servers:
  discord:
    exposure: {style: dynamic}
    operations:
      deprecated_list_pins:
        tool:
          description: Deprecated duplicate of list_pins; use list_pins instead.
      deprecated_create_pin:
        tool:
          description: Deprecated duplicate of create_pin; use create_pin instead.
      deprecated_delete_pin:
        tool:
          description: Deprecated duplicate of delete_pin; use delete_pin instead.
      ban_user_from_guild:
        tool:
          params_strategy: merge
          params:
            delete_message_days: {hidden: true}
