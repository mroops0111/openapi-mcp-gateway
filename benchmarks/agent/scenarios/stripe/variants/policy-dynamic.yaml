# Intent policy with dynamic (search/get/call) exposure.
servers:
  stripe:
    exposure:
      style: dynamic
    policy:
      allow:
        - "* /v1/customers*"
        - "* /v1/subscriptions*"
        - "* /v1/subscription_items*"
        - "* /v1/subscription_schedules*"
        - "* /v1/invoices*"
        - "* /v1/invoiceitems*"
        - "GET /v1/invoice_payments*"
        - "* /v1/credit_notes*"
        - "* /v1/refunds*"
        - "GET /v1/charges*"
        - "* /v1/charges/*/refund*"
        - "GET /v1/payment_intents*"
        - "GET /v1/payment_methods*"
        - "* /v1/payment_methods/*/attach"
        - "* /v1/payment_methods/*/detach"
        - "* /v1/prices*"
        - "* /v1/products"
        - "* /v1/products/search"
        - "* /v1/products/{id}"
        - "* /v1/coupons*"
        - "* /v1/promotion_codes*"
        - "GET /v1/tax_rates*"
        - "GET /v1/balance_transactions*"
        - "GET /v1/events*"
      deny:
        # legacy card/bank-source APIs and cash-balance funding: not needed for shop billing
        - "* /v1/customers/*/bank_accounts*"
        - "* /v1/customers/*/cards*"
        - "* /v1/customers/*/sources*"
        - "* /v1/customers/*/cash_balance*"
        - "* /v1/customers/*/funding_instructions"
        - "GET /v1/charges/*/dispute"
