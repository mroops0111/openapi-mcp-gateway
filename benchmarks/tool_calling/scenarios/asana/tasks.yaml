- id: asana-t01
  prompt: >-
    Add a task called "Draft launch checklist" to our Website Redesign project, due December 1, 2026.
  split: dev
  expected_calls:
    # The due date may come with the new task, or in an update after it.
    - any_of:
        - server: asana
          method: POST
          path: /tasks
          body: {data: {name: Draft launch checklist, projects: ['1205000000000101'], due_on: '2026-12-01'}}
        - all_of:
            - server: asana
              method: POST
              path: /tasks
              body: {data: {name: Draft launch checklist, projects: ['1205000000000101']}}
            - server: asana
              method: PUT
              path: /tasks/{task_gid}
              path_parameters: {task_gid: '1206000000000111'}
              body: {data: {due_on: '2026-12-01'}}
  solution:
    - server: asana
      operation: create_task
      arguments: {data: {name: Draft launch checklist, projects: ['1205000000000101'], due_on: '2026-12-01'}}
  responses:
    - server: asana
      method: GET
      path: /workspaces
      body: &workspaces {data: [{gid: '1200000000000001', name: Acme Corp, resource_type: workspace}]}
    # The acting user is a teammate in the one workspace.
    - server: asana
      method: GET
      path: /users/me
      body: &me {data: {gid: '1201000000000099', name: Jordan Lee, email: jordan.lee@acme.example, resource_type: user, workspaces: [{gid: '1200000000000001', name: Acme Corp, resource_type: workspace}]}}
    - server: asana
      method: GET
      path: /users/me/favorites
      body: &no-favorites {data: []}
    - server: asana
      method: GET
      path: /workspaces/{workspace_gid}/teams
      body: &teams {data: [{gid: '1204000000000001', name: Everyone at Acme, resource_type: team}]}
    - server: asana
      method: GET
      path: /users/me/teams
      body: *teams
    - server: asana
      method: GET
      path: /projects
      body: &t01-projects {data: [{gid: '1205000000000101', name: Website Redesign, resource_type: project}, {gid: '1205000000000102', name: Mobile App Redesign, resource_type: project}, {gid: '1205000000000103', name: Website Redesign 2025 (old), resource_type: project}]}
    - server: asana
      method: GET
      path: /workspaces/{workspace_gid}/projects
      body: *t01-projects
    - server: asana
      method: GET
      path: /workspaces/{workspace_gid}/projects/search
      body: *t01-projects
    - server: asana
      method: GET
      path: /workspaces/{workspace_gid}/typeahead
      query: {resource_type: project}
      body: *t01-projects
    - server: asana
      method: GET
      path: /teams/{team_gid}/projects
      body: *t01-projects
    - server: asana
      method: GET
      path: /projects/1205000000000101
      body: {data: {gid: '1205000000000101', name: Website Redesign, resource_type: project, archived: false, workspace: {gid: '1200000000000001', name: Acme Corp}, team: {gid: '1204000000000001', name: Everyone at Acme}}}
    - server: asana
      method: POST
      path: /tasks
      body: {data: {gid: '1206000000000111', name: Draft launch checklist, resource_type: task}}

