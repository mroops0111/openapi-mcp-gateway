# Generate it again rather than editing it.
servers:
  asana:
    instructions: |
      Plan and track team work in Asana: find tasks, create them, assign them and update them.
      Start with get_workspaces to learn the workspace gid, then find projects with get_projects
      and people with get_users_for_workspace. All ids are "gid" strings. Use assignee "me" for
      the current user. Dates are YYYY-MM-DD.
    policy:
      allow:
      - getWorkspaces
      - getProjects
      - getProject
      - getSectionsForProject
      - getUsersForWorkspace
      - getTasksForProject
      - getTasksForSection
      - searchTasksForWorkspace
      - getTask
      - getSubtasksForTask
      - createTask
      - createSubtaskForTask
      - updateTask
      - addTaskForSection
      - addProjectForTask
      - createStoryForTask
      - getStoriesForTask
    operations:
      getWorkspaces:
        tool:
          params_strategy: merge
          response: |
            [ data.{ "gid": gid, "name": name } ]
      getProjects:
        tool:
          params_strategy: merge
          description: List projects, optionally limited to one workspace or team. Returns gid and name.
          response: |
            { "projects": [ data.{ "gid": gid, "name": name } ], "next_offset": next_page.offset }
      getProject:
        tool:
          params_strategy: merge
          response: |
            data.{ "gid": gid, "name": name, "notes": notes, "archived": archived,
                   "owner": owner.name, "due_on": due_on, "permalink_url": permalink_url }
      getSectionsForProject:
        tool:
          params_strategy: merge
          response: |
            { "sections": [ data.{ "gid": gid, "name": name } ], "next_offset": next_page.offset }
      getUsersForWorkspace:
        tool:
          params_strategy: merge
          description: List the people in a workspace, to find the gid to assign a task to.
          response: |
            { "users": [ data.{ "gid": gid, "name": name } ], "next_offset": next_page.offset }
      getTasksForProject:
        tool:
          params_strategy: merge
          description: List the tasks in a project with their status, assignee and due date.
          params:
            opt_fields:
              hidden: true
              default: name,completed,assignee.name,due_on,permalink_url
          response: |
            { "tasks": [ data.{ "gid": gid, "name": name, "completed": completed,
                "assignee": assignee.name, "due_on": due_on, "url": permalink_url } ],
              "next_offset": next_page.offset }
      getTasksForSection:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,completed,assignee.name,due_on,permalink_url
          response: |
            { "tasks": [ data.{ "gid": gid, "name": name, "completed": completed,
                "assignee": assignee.name, "due_on": due_on, "url": permalink_url } ],
              "next_offset": next_page.offset }
      searchTasksForWorkspace:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,completed,assignee.name,due_on,permalink_url
          response: |
            [ data.{ "gid": gid, "name": name, "completed": completed,
                "assignee": assignee.name, "due_on": due_on, "url": permalink_url } ]
      getTask:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,notes,completed,assignee.name,due_on,start_on,parent.name,projects.name,memberships.section.name,num_subtasks,tags.name,permalink_url
          response: |
            data.{ "gid": gid, "name": name, "notes": notes, "completed": completed,
                   "assignee": assignee.{ "gid": gid, "name": name },
                   "due_on": due_on, "start_on": start_on, "parent": parent.name,
                   "projects": [ projects.{ "gid": gid, "name": name } ],
                   "sections": [ memberships.section.name ],
                   "num_subtasks": num_subtasks, "tags": [ tags.name ], "url": permalink_url }
      getSubtasksForTask:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,completed,assignee.name,due_on,permalink_url
          response: |
            { "subtasks": [ data.{ "gid": gid, "name": name, "completed": completed,
                "assignee": assignee.name, "due_on": due_on, "url": permalink_url } ],
              "next_offset": next_page.offset }
      createTask:
        tool:
          description: Create a task. Give at least one of projects, parent or workspace. Assign it with assignee (a user
            gid, an email, or "me").
          params_strategy: replace
          params:
            name:
              type: string
              description: Task title.
            notes:
              type: string
              description: Plain-text description of the task.
            projects:
              type: array
              items:
                type: string
              description: Project gids to put the task in.
            workspace:
              type: string
              description: Workspace gid. Only needed when neither projects nor parent is given.
            assignee:
              type: string
              description: 'Who owns the task: a user gid, an email address, or "me".'
            due_on:
              type: string
              description: Due date, YYYY-MM-DD.
            start_on:
              type: string
              description: Start date, YYYY-MM-DD. Requires due_on.
          request: |
            { "data": { "name": name, "notes": notes, "projects": projects, "workspace": workspace,
                        "assignee": assignee, "due_on": due_on, "start_on": start_on } }
          response: |
            data.{ "gid": gid, "name": name, "assignee": assignee.name, "due_on": due_on,
                   "projects": [ projects.name ], "url": permalink_url }
      createSubtaskForTask:
        tool:
          description: Create a subtask under an existing task.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the parent task.
            name:
              type: string
              description: Subtask title.
            notes:
              type: string
              description: Plain-text description.
            assignee:
              type: string
              description: A user gid, an email address, or "me".
            due_on:
              type: string
              description: Due date, YYYY-MM-DD.
          request: |
            { "task_gid": task_gid,
              "data": { "name": name, "notes": notes, "assignee": assignee, "due_on": due_on } }
          response: |
            data.{ "gid": gid, "name": name, "assignee": assignee.name, "due_on": due_on, "url": permalink_url }
      updateTask:
        tool:
          description: Change a task. Send only the fields to change. Use it to rename, reassign, reschedule, edit notes,
            or mark the task complete.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to change.
            name:
              type: string
              description: New title.
            notes:
              type: string
              description: New plain-text description (replaces the old one).
            assignee:
              type: string
              description: 'New owner: a user gid, an email address, or "me".'
            due_on:
              type: string
              description: New due date, YYYY-MM-DD.
            start_on:
              type: string
              description: New start date, YYYY-MM-DD.
            completed:
              type: boolean
              description: true to mark the task done, false to reopen it.
          request: |
            { "task_gid": task_gid,
              "data": { "name": name, "notes": notes, "assignee": assignee, "due_on": due_on,
                        "start_on": start_on, "completed": completed } }
          response: |
            data.{ "gid": gid, "name": name, "completed": completed, "assignee": assignee.name,
                   "due_on": due_on, "url": permalink_url }
      addTaskForSection:
        tool:
          description: Move a task into a section (board column) of a project.
          params_strategy: replace
          params:
            section_gid:
              type: string
              description: Gid of the section to move the task into.
            task:
              type: string
              description: Gid of the task to move.
          request: |
            { "section_gid": section_gid, "data": { "task": task } }
          response: |
            { "moved": true }
      addProjectForTask:
        tool:
          description: Add an existing task to another project.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task.
            project:
              type: string
              description: Gid of the project to add the task to.
          request: |
            { "task_gid": task_gid, "data": { "project": project } }
          response: |
            { "added": true }
      createStoryForTask:
        tool:
          description: Add a comment to a task.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task.
            text:
              type: string
              description: The comment text.
          request: |
            { "task_gid": task_gid, "data": { "text": text } }
          response: |
            data.{ "gid": gid, "created_at": created_at, "text": text }
      getStoriesForTask:
        tool:
          params_strategy: merge
          description: List the comments and activity on a task.
          response: |
            { "stories": [ data.{ "gid": gid, "type": resource_subtype, "created_by": created_by.name,
                "created_at": created_at, "text": text } ], "next_offset": next_page.offset }
