servers:
  asana:
    instructions: |
      Plan and track team work in Asana: find projects, create, assign and update tasks.
      Start with get_workspaces to learn the workspace gid, then get_projects_for_workspace
      to find project gids. Use get_users_for_workspace to look up a person's gid or email
      before assigning. Dates are YYYY-MM-DD.
    policy:
      allow:
      - getWorkspaces
      - getProjectsForWorkspace
      - getSectionsForProject
      - getUsersForWorkspace
      - getTasksForProject
      - getTask
      - createTask
      - updateTask
      - createSubtaskForTask
      - addTaskForSection
      - addProjectForTask
      - createStoryForTask
    operations:
      getTasksForProject:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              default:
              - name
              - assignee.name
              - due_on
              - completed
              - permalink_url
      getTask:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              default:
              - name
              - notes
              - assignee.name
              - due_on
              - start_on
              - completed
              - parent.name
              - projects.name
              - memberships.section.name
              - permalink_url
      createTask:
        tool:
          description: Create a task. Give at least one of projects, parent or workspace. Assignee may be "me", an email address
            or a user gid.
          params_strategy: replace
          params:
            name:
              type: string
              description: Task title.
            notes:
              type: string
              description: Task description (plain text).
            assignee:
              type: string
              description: '"me", an email address, or a user gid.'
            due_on:
              type: string
              description: Due date, YYYY-MM-DD.
            start_on:
              type: string
              description: Start date, YYYY-MM-DD. Requires due_on.
            projects:
              type: array
              items:
                type: string
              description: Gids of the projects to add the task to.
            parent:
              type: string
              description: Gid of a parent task, to make this a subtask.
            workspace:
              type: string
              description: Workspace gid. Only needed when no project or parent is given.
          request: |
            { "data": { "name": name, "notes": notes, "assignee": assignee, "due_on": due_on,
              "start_on": start_on, "projects": projects, "parent": parent, "workspace": workspace } }
          response: |
            data.{ "gid": gid, "name": name, "permalink_url": permalink_url }
      updateTask:
        tool:
          description: Change a task's title, notes, assignee, dates or completion. Only the fields you pass are changed.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to update.
            name:
              type: string
              description: New title.
            notes:
              type: string
              description: New description (plain text).
            assignee:
              type: string
              description: '"me", an email address, or a user gid.'
            due_on:
              type: string
              description: Due date, YYYY-MM-DD.
            start_on:
              type: string
              description: Start date, YYYY-MM-DD. Needs a due date on the task.
            completed:
              type: boolean
              description: true to mark complete, false to reopen.
          request: |
            { "task_gid": task_gid,
              "data": { "name": name, "notes": notes, "assignee": assignee, "due_on": due_on,
                "start_on": start_on, "completed": completed } }
          response: |
            data.{ "gid": gid, "name": name, "permalink_url": permalink_url }
