# Tailored: task-planning policy, dynamic exposure, and shaping of the core task, section, and lookup operations.
servers:
  asana:
    policy:
      allow:
        # Context lookups, such as workspaces, teams, users, and typeahead search
        - getWorkspaces
        - getWorkspace
        - getTeamsForWorkspace
        - getTeamsForUser
        - getTeam
        - getUsers
        - getUser
        - getUsersForWorkspace
        - getUsersForTeam
        - getUserForWorkspace
        - typeaheadForWorkspace
        # Projects
        - getProjects
        - getProject
        - getProjectsForTeam
        - getProjectsForWorkspace
        - searchProjectsForWorkspace
        - getProjectsForTask
        - createProject
        - createProjectForTeam
        - createProjectForWorkspace
        - updateProject
        - getTaskCountsForProject
        - getProjectMembershipsForProject
        - addMembersForProject
        - getCustomFieldSettingsForProject
        # Sections
        - getSectionsForProject
        - getSection
        - createSectionForProject
        - updateSection
        - deleteSection
        - insertSectionForProject
        - addTaskForSection
        # Tasks
        - getTasks
        - getTask
        - createTask
        - updateTask
        - deleteTask
        - duplicateTask
        - getTasksForProject
        - getTasksForSection
        - getTasksForTag
        - getTasksForUserTaskList
        - getUserTaskListForUser
        - searchTasksForWorkspace
        - getTaskForCustomID
        - getSubtasksForTask
        - createSubtaskForTask
        - setParentForTask
        - getDependenciesForTask
        - addDependenciesForTask
        - removeDependenciesForTask
        - getDependentsForTask
        - addDependentsForTask
        - removeDependentsForTask
        - addProjectForTask
        - removeProjectForTask
        - addFollowersForTask
        - removeFollowerForTask
        - getJob
        # Tags
        - getTags
        - getTagsForWorkspace
        - getTagsForTask
        - createTagForWorkspace
        - addTagForTask
        - removeTagForTask
        # Comments and activity on tasks
        - getStoriesForTask
        - createStoryForTask
    exposure:
      style: dynamic
    instructions: |
      Asana identifies everything by gid. Find the workspace first (get_workspaces), then look up
      projects, sections, and people by name with typeahead_for_workspace before acting.
      Assignees accept a user gid, an email, or "me". Dates use YYYY-MM-DD (due_on, start_on).
      To mark a task done, update it with completed: true.
    operations:
      createTask:
        tool:
          description: |
            Create a task. Put fields under `data`: name, notes, assignee (user gid, email, or "me"),
            due_on (YYYY-MM-DD), projects (list of project gids), and optionally memberships
            ([{project, section}]) to place it in a section, parent, followers, tags, custom_fields
            ({custom_field_gid: value}). Needs projects, parent, or workspace.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
          response: |
            data.{ "gid": gid, "name": name, "assignee": assignee.name, "due_on": due_on,
                   "completed": completed, "projects": [projects.name],
                   "sections": [memberships.section.name], "permalink_url": permalink_url }
      updateTask:
        tool:
          description: |
            Update a task's fields under `data`: name, notes, assignee (user gid, email, "me", or null
            to unassign), due_on / start_on (YYYY-MM-DD), completed (true to mark done), custom_fields.
            Only the fields you send change. To move a task to a section use add_task_for_section.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
          response: |
            data.{ "gid": gid, "name": name, "assignee": assignee.name, "due_on": due_on,
                   "start_on": start_on, "completed": completed, "notes": notes,
                   "custom_fields": [custom_fields.{ "name": name, "value": display_value }],
                   "sections": [memberships.section.name], "permalink_url": permalink_url }
      getTask:
        tool:
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
          response: |
            data.{ "gid": gid, "name": name, "notes": notes, "resource_subtype": resource_subtype,
                   "assignee": assignee ? { "gid": assignee.gid, "name": assignee.name },
                   "due_on": due_on, "due_at": due_at, "start_on": start_on,
                   "completed": completed, "completed_at": completed_at,
                   "parent": parent ? { "gid": parent.gid, "name": parent.name },
                   "num_subtasks": num_subtasks,
                   "memberships": [memberships.{ "project": project.name, "project_gid": project.gid,
                                                 "section": section.name, "section_gid": section.gid }],
                   "tags": [tags.name], "followers": [followers.name],
                   "custom_fields": [custom_fields.{ "gid": gid, "name": name, "value": display_value }],
                   "permalink_url": permalink_url }
      getTasksForProject:
        tool:
          name: list_project_tasks
          description: |
            List tasks in a project. By default returns name, assignee, due date, completion, and
            section for each task. Pass completed_since=now to get only incomplete tasks.
            Pass the returned next_offset as offset to get the next page.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            limit: { default: 100 }
            opt_fields:
              default: [name, assignee.name, due_on, completed, memberships.section.name]
          response: |
            { "tasks": data, "next_offset": next_page.offset }
      getTasksForSection:
        tool:
          name: list_section_tasks
          description: |
            List tasks in a section (column) of a project. Pass completed_since=now for only
            incomplete tasks, and the returned next_offset as offset for the next page.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            limit: { default: 100 }
            opt_fields:
              default: [name, assignee.name, due_on, completed]
          response: |
            { "tasks": data, "next_offset": next_page.offset }
      searchTasksForWorkspace:
        tool:
          name: search_tasks
          description: |
            Search tasks in a workspace by text and filters such as assignee_any ("me", email, or gid),
            projects_any, sections_any, completed, due_on_before / due_on_after. Results are not
            paginated; narrow the filters if you hit the limit.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            resource_subtype:
              default: default_task
              description: Task kind to return. Use default_task for ordinary tasks, milestone for milestones.
            opt_fields:
              default: [name, assignee.name, due_on, completed, projects.name, memberships.section.name]
          response: |
            { "tasks": data }
      typeaheadForWorkspace:
        tool:
          name: find_in_workspace
          description: |
            Find a project, user, team, tag, or task in a workspace by (partial) name and get its gid.
            Set resource_type and query.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            type: { hidden: true }
          response: |
            [data.{ "gid": gid, "name": name, "resource_type": resource_type }]
      getSectionsForProject:
        tool:
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            limit: { default: 100 }
          response: |
            [data.{ "gid": gid, "name": name }]
      addTaskForSection:
        tool:
          name: move_task_to_section
          description: |
            Move a task into a section of a project it belongs to (removing it from its other section
            there). Put the task gid in data.task; optionally insert_before / insert_after a task gid.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
      getUsersForWorkspace:
        tool:
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
            opt_fields: { default: [name, email] }
          response: |
            { "users": [data.{ "gid": gid, "name": name, "email": email }], "next_offset": next_page.offset }
      createStoryForTask:
        tool:
          name: add_comment_to_task
          description: Add a comment to a task. Put the comment text in data.text.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
          response: |
            data.{ "gid": gid, "text": text, "created_at": created_at }
      getStoriesForTask:
        tool:
          description: |
            List a task's comments and activity. Set resource_subtype=comment_added for comments only.
          params_strategy: merge
          params:
            opt_pretty: { hidden: true }
          response: |
            { "stories": [data.{ "gid": gid, "created_at": created_at, "created_by": created_by.name,
                                 "type": resource_subtype, "text": text }],
              "next_offset": next_page.offset }
