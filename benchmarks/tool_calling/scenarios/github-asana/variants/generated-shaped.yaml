# Generated by anthropic:claude-sonnet-5-5 with the generate-config skill, from the intent and never the tasks.
# Written on 2026-11-23T16:27:40+00:00, and generated-shaped.provenance.json beside it records the request and the run.
# Generate it again rather than editing it.
servers:
  github:
    instructions: |
      GitHub side of the GitHub-to-Asana workflow. Read issues and pull requests here
      (start with issues_list_for_repo or search_issues_and_pull_requests), mirror them as Asana
      tasks, then use issues_create_comment to post the Asana task link back on the issue.
      When the Asana task is completed, close the issue with issues_update (state: closed).
    policy:
      allow:
      - issues/list-for-repo
      - issues/get
      - issues/list-comments
      - issues/create-comment
      - issues/update
      - pulls/list
      - pulls/get
      - search/issues-and-pull-requests
    operations:
      issues/list-for-repo:
        tool:
          params_strategy: merge
          params:
            per_page:
              default: 30
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "is_pull_request": $exists(pull_request),
              "url": html_url,
              "author": user.login,
              "labels": [labels.name],
              "assignees": [assignees.login],
              "body": body,
              "updated_at": updated_at
            } ]
      issues/get:
        tool:
          response: |
            {
              "number": number,
              "title": title,
              "state": state,
              "is_pull_request": $exists(pull_request),
              "url": html_url,
              "author": user.login,
              "labels": [labels.name],
              "assignees": [assignees.login],
              "milestone": milestone.title,
              "body": body,
              "comments": comments,
              "created_at": created_at,
              "updated_at": updated_at,
              "closed_at": closed_at
            }
      issues/list-comments:
        tool:
          response: |
            [ $.{
              "id": id,
              "author": user.login,
              "body": body,
              "url": html_url,
              "created_at": created_at
            } ]
      pulls/list:
        tool:
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "draft": draft,
              "url": html_url,
              "author": user.login,
              "head": head.ref,
              "base": base.ref,
              "updated_at": updated_at
            } ]
      pulls/get:
        tool:
          response: |
            {
              "number": number,
              "title": title,
              "state": state,
              "draft": draft,
              "merged": merged,
              "mergeable": mergeable,
              "url": html_url,
              "author": user.login,
              "head": head.ref,
              "base": base.ref,
              "body": body,
              "changed_files": changed_files,
              "additions": additions,
              "deletions": deletions,
              "updated_at": updated_at
            }
      search/issues-and-pull-requests:
        tool:
          response: |
            {
              "total_count": total_count,
              "items": [ items.{
                "number": number,
                "title": title,
                "state": state,
                "is_pull_request": $exists(pull_request),
                "url": html_url,
                "repository_url": repository_url,
                "labels": [labels.name],
                "updated_at": updated_at
              } ]
            }
  asana:
    instructions: |
      Asana side of the GitHub-to-Asana workflow. Call get_workspaces, then get_projects_for_workspace
      to find the project gid. Before creating a task for a GitHub issue or pull request, look for
      an existing one with search_tasks_for_workspace (text = the GitHub URL) to avoid duplicates.
      Create tasks with create_task and put the GitHub URL in notes. Keep them in step with
      update_task (completed, due_on, assignee) and create_story_for_task for progress comments.
    policy:
      allow:
      - getWorkspaces
      - getProjectsForWorkspace
      - getSectionsForProject
      - getTasksForProject
      - searchTasksForWorkspace
      - getTask
      - createTask
      - updateTask
      - createStoryForTask
    operations:
      getWorkspaces:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name
          response: |
            [ data.{ "gid": gid, "name": name } ]
      getProjectsForWorkspace:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,archived,permalink_url
          response: |
            { "projects": [ data.{ "gid": gid, "name": name, "archived": archived, "url": permalink_url } ],
              "next_offset": next_page.offset }
      getSectionsForProject:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name
          response: |
            [ data.{ "gid": gid, "name": name } ]
      getTasksForProject:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,completed,due_on,assignee.name,permalink_url
          response: |
            { "tasks": [ data.{ "gid": gid, "name": name, "completed": completed, "due_on": due_on,
                "assignee": assignee.name, "url": permalink_url } ],
              "next_offset": next_page.offset }
      searchTasksForWorkspace:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,completed,due_on,assignee.name,permalink_url,notes
          response: |
            [ data.{ "gid": gid, "name": name, "completed": completed, "due_on": due_on,
                "assignee": assignee.name, "url": permalink_url, "notes": notes } ]
      getTask:
        tool:
          params_strategy: merge
          params:
            opt_fields:
              hidden: true
              default: name,notes,completed,completed_at,due_on,assignee.name,permalink_url,projects.name,memberships.section.name,parent.name
          response: |
            data.{
              "gid": gid,
              "name": name,
              "notes": notes,
              "completed": completed,
              "completed_at": completed_at,
              "due_on": due_on,
              "assignee": assignee.name,
              "projects": [projects.name],
              "section": memberships.section.name,
              "parent": parent.name,
              "url": permalink_url
            }
      createTask:
        tool:
          description: |
            Create an Asana task, typically to track a GitHub issue or pull request. Put the
            GitHub URL in notes so the two can be matched later. Give project_gid (preferred)
            or workspace_gid.
          params_strategy: replace
          params:
            name:
              type: string
              description: Task title, e.g. "owner/repo#123 Fix login bug".
            notes:
              type: string
              description: Task description. Include the GitHub issue or PR URL.
            project_gid:
              type: string
              description: Gid of the project to add the task to (from getProjectsForWorkspace).
            workspace_gid:
              type: string
              description: Gid of the workspace. Only needed when project_gid is not given.
            assignee:
              type: string
              description: Assignee, as "me", an email address, or a user gid.
            due_on:
              type: string
              description: Due date as YYYY-MM-DD.
          request: |
            { "data": {
                "name": name,
                "notes": notes,
                "projects": project_gid ? [project_gid],
                "workspace": workspace_gid,
                "assignee": assignee,
                "due_on": due_on
            } }
          response: |
            data.{ "gid": gid, "name": name, "url": permalink_url }
      updateTask:
        tool:
          description: |
            Update an Asana task to match its GitHub issue or PR, for example mark it completed
            when the issue is closed. Send only the fields that change.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to update.
            name:
              type: string
              description: New title.
            notes:
              type: string
              description: New description.
            completed:
              type: boolean
              description: true to mark the task complete, false to reopen it.
            assignee:
              type: string
              description: New assignee, as "me", an email address, or a user gid.
            due_on:
              type: string
              description: New due date as YYYY-MM-DD.
          request: |
            { "task_gid": task_gid,
              "data": {
                "name": name,
                "notes": notes,
                "completed": completed,
                "assignee": assignee,
                "due_on": due_on
            } }
          response: |
            data.{ "gid": gid, "name": name, "completed": completed, "due_on": due_on, "url": permalink_url }
      createStoryForTask:
        tool:
          description: Add a comment to an Asana task, e.g. a status update from GitHub.
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to comment on.
            text:
              type: string
              description: Comment text.
          request: |
            { "task_gid": task_gid, "data": { "text": text } }
          response: |
            data.{ "gid": gid, "created_at": created_at }
