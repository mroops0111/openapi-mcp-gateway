# Generated by anthropic:claude-sonnet-5-5 with the generate-config skill, from the intent and never the tasks.
# Written on 2026-11-17T10:15:45+00:00, and generated-shaped.provenance.json records the request and the run.
# Generate it again rather than editing it.
servers:
  github:
    instructions: |
      GitHub is the source of engineering work (issues and pull requests). Read an issue or PR here,
      then mirror it as an Asana task with the asana server. Put the Asana task link in a comment on
      the GitHub issue (issues/create-comment) so the two stay linked.
    policy:
      allow:
      - issues/list-for-repo
      - issues/get
      - issues/create
      - issues/update
      - issues/list-comments
      - issues/create-comment
      - pulls/list
      - pulls/get
    operations:
      issues/list-for-repo:
        tool:
          params_strategy: merge
          response: |
            [ $.{ "number": number, "title": title, "state": state, "url": html_url,
                  "assignees": [assignees.login], "labels": [labels.name],
                  "updated_at": updated_at, "is_pull_request": $exists(pull_request) } ]
      issues/get:
        tool:
          response: |
            { "number": number, "title": title, "state": state, "url": html_url, "body": body,
              "assignees": [assignees.login], "labels": [labels.name], "milestone": milestone.title,
              "comments": comments, "created_at": created_at, "updated_at": updated_at,
              "closed_at": closed_at }
      pulls/list:
        tool:
          response: |
            [ $.{ "number": number, "title": title, "state": state, "draft": draft, "url": html_url,
                  "author": user.login, "head": head.ref, "base": base.ref, "updated_at": updated_at } ]
      pulls/get:
        tool:
          response: |
            { "number": number, "title": title, "state": state, "draft": draft, "merged": merged,
              "url": html_url, "body": body, "author": user.login, "head": head.ref, "base": base.ref,
              "created_at": created_at, "updated_at": updated_at, "merged_at": merged_at }
  asana:
    instructions: |
      Asana holds the tracked tasks. Call getWorkspaces, then getProjectsForWorkspace to find the
      project gid before creating a task. When mirroring a GitHub issue or PR, put its URL in the
      task notes and name the task after the issue title, so the two can be matched later.
    policy:
      allow:
      - getWorkspaces
      - getProjectsForWorkspace
      - getTasksForProject
      - getTask
      - createTask
      - updateTask
      - getStoriesForTask
      - createStoryForTask
    operations:
      createTask:
        tool:
          params_strategy: replace
          params:
            name:
              type: string
              description: Task title. For a GitHub issue, use the issue title.
            project_gid:
              type: string
              description: Gid of the Asana project to put the task in (from getProjectsForWorkspace).
            notes:
              type: string
              description: Task description. Include the GitHub issue or PR URL here.
            assignee:
              type: string
              description: Who to assign, as "me", an email address or a user gid. Omit to leave unassigned.
            due_on:
              type: string
              description: Due date as YYYY-MM-DD. Omit for no due date.
          request: |
            { "data": { "name": name, "projects": [project_gid], "notes": notes,
                        "assignee": assignee, "due_on": due_on } }
          response: |
            { "gid": data.gid, "name": data.name, "url": data.permalink_url,
              "completed": data.completed, "due_on": data.due_on }
      updateTask:
        tool:
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to update.
            name:
              type: string
              description: New title. Omit to keep the current one.
            notes:
              type: string
              description: New description, replacing the old one. Omit to keep it.
            completed:
              type: boolean
              description: Set true when the GitHub issue or PR is closed or merged, false to reopen.
            assignee:
              type: string
              description: '"me", an email address or a user gid. Omit to keep the current assignee.'
            due_on:
              type: string
              description: Due date as YYYY-MM-DD. Omit to keep it.
          request: |
            { "task_gid": task_gid,
              "data": { "name": name, "notes": notes, "completed": completed,
                        "assignee": assignee, "due_on": due_on } }
          response: |
            { "gid": data.gid, "name": data.name, "url": data.permalink_url,
              "completed": data.completed, "due_on": data.due_on }
      createStoryForTask:
        tool:
          params_strategy: replace
          params:
            task_gid:
              type: string
              description: Gid of the task to comment on.
            text:
              type: string
              description: Comment text, for example a note that the GitHub PR was merged.
          request: |
            { "task_gid": task_gid, "data": { "text": text } }
          response: |
            { "gid": data.gid, "created_at": data.created_at, "text": data.text }
