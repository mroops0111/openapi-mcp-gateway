# A config that knows nothing of the intent,
# with dynamic exposure on both large APIs and rules that suit any use of them.
servers:
  github:
    exposure:
      style: dynamic
    instructions: |
      The GitHub REST API: repositories, issues, pull requests, code, actions, organizations and users.
      Find operations with search_operations, read their arguments with get_operation, then call_operation.
  asana:
    exposure:
      style: dynamic
    instructions: |
      The Asana API: workspaces, teams, projects, sections, tasks, comments (stories), users, tags, goals.
      Find operations with search_operations, read their arguments with get_operation, then call_operation.
      Ids are string gids; request body fields go inside "data".
    operations:
      searchTasksForWorkspace:
        tool:
          params_strategy: merge
          params:
            # the spec defaults this filter to milestone, which hides ordinary tasks from search
            resource_subtype: { default: default_task }
