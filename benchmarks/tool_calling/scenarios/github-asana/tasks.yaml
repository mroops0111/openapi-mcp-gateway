        - {number: 8, title: Billing v3, state: open, due_on: '2027-03-12T08:00:00Z'}
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: {data: [{gid: '1202000000000021', name: API Platform}, {gid: '1202000000000022', name: API Docs}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1202000000000021', name: API Platform}, {gid: '1202000000000022', name: API Docs}]}
    - server: asana
      method: GET
      path: /projects/1202000000000021/tasks
      body: {data: [{gid: '1203000000000501', name: Ship billing v2}, {gid: '1203000000000502', name: Ship billing v2 docs}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: {data: [{gid: '1203000000000501', name: Ship billing v2}, {gid: '1203000000000502', name: Ship billing v2 docs}]}

