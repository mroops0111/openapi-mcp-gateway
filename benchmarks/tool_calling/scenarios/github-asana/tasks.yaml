        - {number: 641, title: Update copyright year, state: open, labels: [{name: chore}]}
        - {number: 645, title: Cache rendered navigation menu, state: open, labels: [{name: perf}, {name: frontend}]}
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}]}
    - server: asana
      method: GET
      path: /projects/1202000000000011/tasks
      body: {data: [{gid: '1203000000000301', name: Q4 performance work}, {gid: '1203000000000302', name: Q3 performance work}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: {data: [{gid: '1203000000000301', name: Q4 performance work}, {gid: '1203000000000302', name: Q3 performance work}]}

