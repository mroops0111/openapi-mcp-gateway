      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000501'}
      body: {data: {due_on: '2026-12-04'}}
  solution:
    - server: github
      operation: issues_list_milestones
      arguments: {owner: acme, repo: api, state: open}
