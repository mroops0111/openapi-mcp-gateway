- id: github-asana-t06
  prompt: >-
    The Asana task "Fix flaky checkout test" in the Web Platform project (Acme Engineering workspace) tracks acme/web
    issue #520. Assign the Asana task to whoever is assigned to that issue on GitHub.
  split: test
  # Asana takes an assignee by gid or by email.
  expected_calls:
    - any_of:
        - server: asana
          method: PUT
          path: /tasks/{task_gid}
          path_parameters: {task_gid: '1203000000000601'}
          body: {data: {assignee: '1201000000000061'}}
        - server: asana
          method: PUT
          path: /tasks/{task_gid}
          path_parameters: {task_gid: '1203000000000601'}
          body: {data: {assignee: tom.becker@acme.example}}
  solution:
    - server: github
      operation: issues_get
      arguments: {owner: acme, repo: web, issue_number: 520}
    - server: asana
      operation: update_task
      arguments: {task_gid: '1203000000000601', data: {assignee: '1201000000000061'}}
  responses:
    - server: github
      method: GET
      path: /repos/acme/web/issues/520
      body: &issue-520 {number: 520, title: Checkout test fails intermittently on CI, state: open, assignees: [{login: tom-becker}]}
