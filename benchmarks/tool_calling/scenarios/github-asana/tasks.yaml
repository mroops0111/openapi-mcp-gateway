    Publish a release of acme/web tagged v3.2.0, titled "v3.2.0", with release notes generated automatically.
  split: final
  in_intent: false
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/releases
      path_parameters: {owner: acme, repo: web}
      body: {tag_name: v3.2.0, name: v3.2.0, generate_release_notes: true}
  solution:
    - server: github
      operation: repos_create_release
      arguments: {owner: acme, repo: web, tag_name: v3.2.0, name: v3.2.0, generate_release_notes: true}

