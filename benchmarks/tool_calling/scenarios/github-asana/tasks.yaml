    - server: github
      method: GET
      path: /repos/acme/web/issues
      body: [*pr-640-issue, *pr-641-issue, *pr-645-issue]
    - server: github
      method: GET
      path: /repos/acme/web/issues
      query: {labels: perf}
      body: [*pr-640-issue, *pr-645-issue]
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 2, incomplete_results: false, items: [*pr-640-issue, *pr-645-issue]}
    - server: asana
      method: GET
      path: /workspaces
      body: *workspaces
    - server: asana
      method: GET
      path: /users/me
      body: *me
    - server: asana
      method: GET
      path: /users/me/favorites
      body: *no-favorites
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/teams
      body: *teams
    - server: asana
      method: GET
      path: /users/me/teams
      body: *teams
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: *web-projects
    - server: asana
      method: GET
      path: /projects
      body: *web-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects/search
      body: *web-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/typeahead
