      operation: get_tasks_for_section
      arguments: {section_gid: '1204000000000011'}
    - server: github
      operation: issues_create
      arguments: {owner: acme, repo: web, title: Cart badge shows stale item count, labels: [bug]}
    - server: github
      operation: issues_create
      arguments: {owner: acme, repo: web, title: Date picker crashes on leap day, labels: [bug]}
