- id: github-asana-t01
  prompt: >-
    Every open issue in acme/web labelled release-blocker needs a task in our Web Platform project in Asana
    (Acme Engineering workspace). Create one task per issue, named exactly like the issue title.
  split: dev
  expected_calls:
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Checkout page times out on Safari, projects: ['1202000000000011']}}
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Password reset email links expire immediately, projects: ['1202000000000011']}}
  solution:
    - server: github
      operation: issues_list_for_repo
      arguments: {owner: acme, repo: web, state: open, labels: release-blocker}
    - server: asana
      operation: create_task
      arguments: {data: {name: Checkout page times out on Safari, projects: ['1202000000000011']}}
    - server: asana
      operation: create_task
      arguments: {data: {name: Password reset email links expire immediately, projects: ['1202000000000011']}}
  responses:
    - server: github
      method: GET
      path: /repos/acme/web/issues
      body:
        - &issue-412 {number: 412, title: Checkout page times out on Safari, state: open, labels: [{name: release-blocker}]}
        - &issue-415 {number: 415, title: Password reset email links expire immediately, state: open, labels: [{name: release-blocker}, {name: auth}]}
        - {number: 418, title: Footer links misaligned on tablet, state: open, labels: [{name: ui}]}
    - server: github
      method: GET
      path: /repos/acme/web/issues
      query: {labels: release-blocker}
      body: [*issue-412, *issue-415]
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 2, incomplete_results: false, items: [*issue-412, *issue-415]}
    - server: asana
      method: GET
      path: /workspaces
      body: &workspaces {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    # The acting user is a teammate in both workspaces.
    - server: asana
      method: GET
      path: /users/me
      body: &me {data: {gid: '1201000000000099', name: Jordan Lee, email: jordan.lee@acme.example, resource_type: user, workspaces: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}}
    - server: asana
      method: GET
      path: /users/me/favorites
      body: &no-favorites {data: []}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/teams
      body: &teams {data: [{gid: '1204000000000001', name: Engineering, resource_type: team}]}
    - server: asana
      method: GET
      path: /users/me/teams
      body: *teams
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: &t01-projects {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}, {gid: '1202000000000021', name: API Platform}]}
    - server: asana
      method: GET
      path: /projects
      body: *t01-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects/search
      body: *t01-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/typeahead
      query: {resource_type: project}
      body: *t01-projects
    - server: asana
      method: GET
      path: /teams/{team_gid}/projects
      body: *t01-projects
    - server: asana
      method: GET
      path: /projects/1202000000000011
      body: &web-platform {data: {gid: '1202000000000011', name: Web Platform, resource_type: project, archived: false, workspace: {gid: '1201000000000001', name: Acme Engineering}, team: {gid: '1204000000000001', name: Engineering}}}
    # The project has no task for these issues yet.
    - server: asana
      method: GET
      path: /projects/1202000000000011/tasks
      body: &no-tasks {data: []}
    - server: asana
      method: GET
      path: /tasks
      query: {project: '1202000000000011'}
      body: *no-tasks
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: *no-tasks

- id: github-asana-t02
  prompt: >-
    Track acme/api issue #330 in Asana: create a task for it in the API Platform project (Acme Engineering
    workspace), named exactly like the issue title.
  split: dev
  expected_calls:
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Rate limit headers missing on 429 responses, projects: ['1202000000000021']}}
  solution:
    - server: github
      operation: issues_get
      arguments: {owner: acme, repo: api, issue_number: 330}
    - server: asana
      operation: create_task
      arguments: {data: {name: Rate limit headers missing on 429 responses, projects: ['1202000000000021']}}
  responses:
    - server: github
      method: GET
      path: /repos/acme/api/issues/330
      body: &issue-330 {number: 330, title: Rate limit headers missing on 429 responses, state: open}
    - server: github
      method: GET
      path: /repos/acme/api/issues
      body:
        - {number: 331, title: Retry-After header ignored by the SDK, state: open}
        - *issue-330
        - {number: 328, title: Pagination cursor resets after 1000 results, state: open}
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 1, incomplete_results: false, items: [*issue-330]}
    - server: asana
      method: GET
      path: /workspaces
      body: *workspaces
    - server: asana
      method: GET
      path: /users/me
      body: *me
    - server: asana
      method: GET
      path: /users/me/favorites
      body: *no-favorites
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/teams
      body: *teams
    - server: asana
      method: GET
      path: /users/me/teams
      body: *teams
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: &api-projects {data: [{gid: '1202000000000021', name: API Platform}, {gid: '1202000000000022', name: API Docs}]}
    - server: asana
      method: GET
      path: /projects
      body: *api-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects/search
      body: *api-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/typeahead
      query: {resource_type: project}
      body: *api-projects
    - server: asana
      method: GET
      path: /teams/{team_gid}/projects
      body: *api-projects
    - server: asana
      method: GET
      path: /projects/1202000000000021
      body: &api-platform {data: {gid: '1202000000000021', name: API Platform, resource_type: project, archived: false, workspace: {gid: '1201000000000001', name: Acme Engineering}, team: {gid: '1204000000000001', name: Engineering}}}
    # The project has no task for this issue yet.
    - server: asana
      method: GET
      path: /projects/1202000000000021/tasks
      body: *no-tasks
    - server: asana
      method: GET
      path: /tasks
      query: {project: '1202000000000021'}
      body: *no-tasks
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: *no-tasks

- id: github-asana-t03
  prompt: >-
    Clean up the Web Platform project in Asana (Acme Engineering workspace): each task there links its acme/web
    GitHub issue in the description. Mark complete every task whose GitHub issue has since been closed, and leave
    the rest alone.
  split: test
  expected_calls:
    - server: asana
      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000201'}
      body: {data: {completed: true}}
    - server: asana
      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000203'}
      body: {data: {completed: true}}
  # The request says to leave the task whose issue is still open alone, and to delete none.
  forbidden_calls:
    - server: asana
      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000202'}
    - server: asana
      method: DELETE
      path: /tasks/{task_gid}
  solution:
    - server: github
      operation: issues_get
      arguments: {owner: acme, repo: web, issue_number: 501}
    - server: asana
      operation: update_task
      arguments: {task_gid: '1203000000000201', data: {completed: true}}
    - server: asana
      operation: update_task
      arguments: {task_gid: '1203000000000203', data: {completed: true}}
  responses:
    - server: asana
      method: GET
      path: /workspaces
      body: *workspaces
    - server: asana
      method: GET
      path: /users/me
      body: *me
    - server: asana
      method: GET
      path: /users/me/favorites
      body: *no-favorites
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/teams
      body: *teams
    - server: asana
      method: GET
      path: /users/me/teams
      body: *teams
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: &web-projects {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}]}
    - server: asana
      method: GET
      path: /projects
      body: *web-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects/search
      body: *web-projects
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/typeahead
      query: {resource_type: project}
      body: *web-projects
    - server: asana
      method: GET
      path: /teams/{team_gid}/projects
      body: *web-projects
    - server: asana
      method: GET
      path: /projects/1202000000000011
      body: *web-platform
    - server: asana
      method: GET
      path: /projects/1202000000000011/tasks
      body:
        data: &t03-tasks
          - &t03-task-201 {gid: '1203000000000201', name: Session cookie not cleared on logout, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/501'}
          - &t03-task-202 {gid: '1203000000000202', name: Image uploads fail over 10MB, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/502'}
          - &t03-task-203 {gid: '1203000000000203', name: Search results ignore locale, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/503'}
    - server: asana
      method: GET
      path: /tasks
      query: {project: '1202000000000011'}
      body: {data: *t03-tasks}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: {data: *t03-tasks}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/typeahead
      query: {resource_type: task}
      body: {data: *t03-tasks}
    - server: asana
      method: GET
      path: /tasks/1203000000000201
      body: {data: *t03-task-201}
    - server: asana
      method: GET
      path: /tasks/1203000000000202
      body: {data: *t03-task-202}
    - server: asana
      method: GET
      path: /tasks/1203000000000203
      body: {data: *t03-task-203}
    - server: github
      method: GET
      path: /repos/acme/web/issues/501
      body: &issue-501 {number: 501, title: Session cookie not cleared on logout, state: closed, state_reason: completed}
    - server: github
      method: GET
      path: /repos/acme/web/issues/502
      body: &issue-502 {number: 502, title: Image uploads fail over 10MB, state: open}
    - server: github
      method: GET
      path: /repos/acme/web/issues/503
      body: &issue-503 {number: 503, title: Search results ignore locale, state: closed, state_reason: completed}
    # The issue list holds open issues unless asked for closed ones or all.
    - server: github
      method: GET
      path: /repos/acme/web/issues
      body: [*issue-502]
    - server: github
      method: GET
      path: /repos/acme/web/issues
      query: {state: closed}
      body: [*issue-501, *issue-503]
    - server: github
      method: GET
      path: /repos/acme/web/issues
      query: {state: all}
      body: [*issue-501, *issue-502, *issue-503]
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 3, incomplete_results: false, items: [*issue-501, *issue-502, *issue-503]}

- id: github-asana-t04
  prompt: >-
    In Asana, under the "Q4 performance work" task in the Web Platform project (Acme Engineering workspace),
    add a subtask for each open pull request in acme/web labelled perf. Name each subtask after the PR title.
  split: test
  # Asana makes a subtask under its parent, or as a new task naming that parent.
  expected_calls:
    - any_of:
        - server: asana
          method: POST
          path: /tasks/{task_gid}/subtasks
          path_parameters: {task_gid: '1203000000000301'}
          body: {data: {name: Lazy-load product images}}
        - server: asana
          method: POST
          path: /tasks
          body: {data: {name: Lazy-load product images, parent: '1203000000000301'}}
    - any_of:
        - server: asana
          method: POST
          path: /tasks/{task_gid}/subtasks
          path_parameters: {task_gid: '1203000000000301'}
          body: {data: {name: Cache rendered navigation menu}}
        - server: asana
          method: POST
          path: /tasks
          body: {data: {name: Cache rendered navigation menu, parent: '1203000000000301'}}
  solution:
    - server: github
      operation: pulls_list
      arguments: {owner: acme, repo: web, state: open}
    - server: asana
      operation: create_subtask_for_task
      arguments: {task_gid: '1203000000000301', data: {name: Lazy-load product images}}
    - server: asana
      operation: create_subtask_for_task
      arguments: {task_gid: '1203000000000301', data: {name: Cache rendered navigation menu}}
  responses:
