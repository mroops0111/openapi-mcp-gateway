      path: /repos/{owner}/{repo}/issues
      path_parameters: {owner: acme, repo: web}
      body: {title: Cart badge shows stale item count, labels: [bug]}
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/issues
      path_parameters: {owner: acme, repo: web}
      body: {title: Date picker crashes on leap day, labels: [bug]}
  solution:
