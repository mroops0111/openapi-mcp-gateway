- id: github-asana-t01
  prompt: >-
    Every open issue in acme/web labelled release-blocker needs a task in our Web Platform project in Asana
    (Acme Engineering workspace). Create one task per issue, named exactly like the issue title.
  split: practice
  in_intent: true
  expected_calls:
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Checkout page times out on Safari, projects: ['1202000000000011']}}
    - server: asana
      method: POST
      path: /tasks
      body: {data: {name: Password reset email links expire immediately, projects: ['1202000000000011']}}
  solution:
    - server: github
      operation: issues_list_for_repo
      arguments: {owner: acme, repo: web, state: open, labels: release-blocker}
    - server: asana
      operation: create_task
      arguments: {data: {name: Checkout page times out on Safari, projects: ['1202000000000011']}}
    - server: asana
      operation: create_task
      arguments: {data: {name: Password reset email links expire immediately, projects: ['1202000000000011']}}
  responses:
    - server: github
      method: GET
      path: /repos/acme/web/issues
      body:
        - {number: 412, title: Checkout page times out on Safari, state: open, labels: [{name: release-blocker}]}
        - {number: 415, title: Password reset email links expire immediately, state: open, labels: [{name: release-blocker}, {name: auth}]}
        - {number: 418, title: Footer links misaligned on tablet, state: open, labels: [{name: ui}]}
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}, {gid: '1202000000000021', name: API Platform}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}, {gid: '1202000000000021', name: API Platform}]}

- id: github-asana-t02
  prompt: >-
    The Asana task "Add rate limiting to public API" in the API Platform project (Acme Engineering workspace)
    is ready for engineering. Open a GitHub issue for it in acme/api with the same title, then leave a comment
    on the Asana task with the link to the new issue.
  split: practice
  in_intent: true
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/issues
      path_parameters: {owner: acme, repo: api}
      body: {title: Add rate limiting to public API}
    - server: asana
      method: POST
      path: /tasks/{task_gid}/stories
      path_parameters: {task_gid: '1203000000000101'}
  solution:
    - server: github
      operation: issues_create
      arguments: {owner: acme, repo: api, title: Add rate limiting to public API, body: Tracked in Asana (API Platform).}
    - server: asana
      operation: create_story_for_task
      arguments: {task_gid: '1203000000000101', data: {text: 'GitHub issue: https://github.com/acme/api/issues/230'}}
  responses:
    - server: github
      method: POST
      path: /repos/acme/api/issues
      body: {number: 230, title: Add rate limiting to public API, state: open, html_url: 'https://github.com/acme/api/issues/230'}
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000021', name: API Platform}, {gid: '1202000000000022', name: API Docs}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000021', name: API Platform}, {gid: '1202000000000022', name: API Docs}]}
    - server: asana
      method: GET
      path: /projects/1202000000000021/tasks
      body: {data: [{gid: '1203000000000101', name: Add rate limiting to public API}, {gid: '1203000000000102', name: Add rate limiting dashboard}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/tasks/search
      body: {data: [{gid: '1203000000000101', name: Add rate limiting to public API}, {gid: '1203000000000102', name: Add rate limiting dashboard}]}

- id: github-asana-t03
  prompt: >-
    Clean up the Web Platform project in Asana (Acme Engineering workspace): each task there links its acme/web
    GitHub issue in the description. Mark complete every task whose GitHub issue has since been closed, and leave
    the rest alone.
  split: final
  in_intent: true
  expected_calls:
    - server: asana
      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000201'}
      body: {data: {completed: true}}
    - server: asana
      method: PUT
      path: /tasks/{task_gid}
      path_parameters: {task_gid: '1203000000000203'}
      body: {data: {completed: true}}
  solution:
    - server: github
      operation: issues_get
      arguments: {owner: acme, repo: web, issue_number: 501}
    - server: asana
      operation: update_task
      arguments: {task_gid: '1203000000000201', data: {completed: true}}
    - server: asana
      operation: update_task
      arguments: {task_gid: '1203000000000203', data: {completed: true}}
  responses:
    - server: asana
      method: GET
      path: /workspaces
      body: {data: [{gid: '1201000000000001', name: Acme Engineering}, {gid: '1201000000000002', name: Acme Marketing}]}
    - server: asana
      method: GET
      path: /workspaces/1201000000000001/projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}]}
    - server: asana
      method: GET
      path: /projects
      body: {data: [{gid: '1202000000000011', name: Web Platform}, {gid: '1202000000000012', name: Web Redesign}]}
    - server: asana
      method: GET
      path: /projects/1202000000000011/tasks
      body:
        data:
          - {gid: '1203000000000201', name: Session cookie not cleared on logout, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/501'}
          - {gid: '1203000000000202', name: Image uploads fail over 10MB, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/502'}
          - {gid: '1203000000000203', name: Search results ignore locale, completed: false, notes: 'GitHub: https://github.com/acme/web/issues/503'}
    - server: github
      method: GET
      path: /repos/acme/web/issues/501
      body: {number: 501, title: Session cookie not cleared on logout, state: closed, state_reason: completed}
    - server: github
      method: GET
      path: /repos/acme/web/issues/502
      body: {number: 502, title: Image uploads fail over 10MB, state: open}
    - server: github
      method: GET
      path: /repos/acme/web/issues/503
      body: {number: 503, title: Search results ignore locale, state: closed, state_reason: completed}
    - server: github
      method: GET
      path: /repos/acme/web/issues
      body:
        - {number: 502, title: Image uploads fail over 10MB, state: open}

- id: github-asana-t04
  prompt: >-
    In Asana, under the "Q4 performance work" task in the Web Platform project (Acme Engineering workspace),
    add a subtask for each open pull request in acme/web labelled perf. Name each subtask after the PR title.
  split: final
  in_intent: true
  expected_calls:
    - server: asana
      method: POST
      path: /tasks/{task_gid}/subtasks
      path_parameters: {task_gid: '1203000000000301'}
      body: {data: {name: Lazy-load product images}}
    - server: asana
      method: POST
      path: /tasks/{task_gid}/subtasks
      path_parameters: {task_gid: '1203000000000301'}
      body: {data: {name: Cache rendered navigation menu}}
  solution:
    - server: github
      operation: pulls_list
      arguments: {owner: acme, repo: web, state: open}
    - server: asana
      operation: create_subtask_for_task
      arguments: {task_gid: '1203000000000301', data: {name: Lazy-load product images}}
    - server: asana
      operation: create_subtask_for_task
      arguments: {task_gid: '1203000000000301', data: {name: Cache rendered navigation menu}}
  responses:
