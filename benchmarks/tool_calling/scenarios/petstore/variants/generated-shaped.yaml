              description: 'Which pets to list: available (for sale), pending (reserved) or sold.'
      updatePetWithForm:
        tool:
          params_strategy: merge
          params:
            status:
              type: string
              enum:
              - available
              - pending
              - sold
              description: 'New status of the pet: available (for sale), pending (reserved) or sold.'
      addPet:
        tool:
          params_strategy: merge
          params:
            status:
              type: string
