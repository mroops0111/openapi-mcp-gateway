# Tailored: same policy plus shaping for pet status upkeep and order handling.
servers:
  petstore:
    instructions: |
      Pet shop back office. Pet status is one of available, pending, sold.
      Use set_pet_status for status or name changes, list_pets_by_status to review
      the catalog, and the order tools to place, look up, or cancel customer orders.
    policy:
      allow: ["* /pet", "* /pet/*", "* /store/*"]
      deny: ["uploadFile"]
    operations:
      findPetsByStatus:
        tool:
          name: list_pets_by_status
          description: List pets with a given status (available, pending, or sold). Returns id, name, status, category, and tags for each pet.
          response: |
            [$.{"id": id, "name": name, "status": status, "category": category.name, "tags": tags.name}]
      updatePetWithForm:
        tool:
          name: set_pet_status
          description: Change a pet's status (available, pending, sold) and/or name by pet id, without resending the whole pet record.
          params_strategy: merge
          params:
            status:
              type: string
              enum: [available, pending, sold]
              description: New status for the pet.
      deletePet:
        tool:
          description: Remove a pet from the store's listing permanently.
          params_strategy: merge
          params:
            api_key: { hidden: true }
      placeOrder:
        tool:
          description: Place a customer order for a pet. Give petId and quantity; status defaults to placed.
          params_strategy: merge
          params:
            status: { default: placed }
            quantity: { default: 1 }
      deleteOrder:
        tool:
          name: cancel_order
          description: Cancel (delete) a customer's purchase order by its id.
