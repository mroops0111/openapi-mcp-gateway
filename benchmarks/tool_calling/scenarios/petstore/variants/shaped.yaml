servers:
  petstore:
    instructions: |
      Pet shop back office. Pets have a status of available, pending or sold.
      Use findPetsByStatus to list pets, addPet to list a new pet, and updatePetWithForm
      to change a pet's status or name. Use placeOrder for a customer order, getOrderById
      to look one up and deleteOrder to cancel it.
    policy:
      allow:
      - addPet
      - findPetsByStatus
      - getPetById
      - updatePetWithForm
      - placeOrder
      - getOrderById
      - deleteOrder
      - getInventory
    operations:
      addPet:
        tool:
          params_strategy: replace
          params:
            name:
              type: string
              description: Pet's name, for example "Rex".
            photoUrls:
              type: array
              items:
                type: string
              default: []
              description: Photo URLs for the pet. May be empty.
            category:
              type: string
              description: Optional kind of pet, for example "Dogs" or "Cats".
            status:
              type: string
              enum:
              - available
              - pending
              - sold
              default: available
              description: Listing status. Use available for a pet that can be bought.
          request: |
            {
              "name": name,
              "photoUrls": photoUrls,
              "status": status,
              "category": category ? { "name": category } : null
            }
      findPetsByStatus:
        tool:
          response: |
            [ $.{ "id": id, "name": name, "category": category.name, "status": status } ]
      updatePetWithForm:
        tool:
          params_strategy: merge
          params:
            status:
              type: string
              enum:
              - available
              - pending
              - sold
              description: New listing status for the pet. Omit to leave it unchanged.
            name:
              type: string
              description: New name for the pet. Omit to leave it unchanged.
      placeOrder:
        tool:
          params_strategy: replace
          params:
            petId:
              type: integer
              description: ID of the pet being ordered. Find it with findPetsByStatus.
            quantity:
              type: integer
              default: 1
              description: Number of units ordered.
          request: |
            {
              "petId": petId,
              "quantity": quantity,
              "status": "placed",
              "complete": false
            }
