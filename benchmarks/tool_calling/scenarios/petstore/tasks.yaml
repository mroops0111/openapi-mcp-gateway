- id: petstore-t01
  prompt: >-
    We just got in a golden retriever puppy named Biscuit. Please add him to the shop's listings as a dog that's available for sale.
  split: dev
  expected_calls:
    - server: petstore
      method: POST
      path: /pet
      body: {name: Biscuit, status: available}
  solution:
    - server: petstore
      operation: add_pet
      arguments: {name: Biscuit, photoUrls: [], category: {name: Dogs}, status: available}

- id: petstore-t02
  prompt: >-
    Our cat Whiskers went home with a new family this morning. Can you mark Whiskers as sold in the shop listings?
  split: dev
  expected_calls:
    # Petstore sets a pet's status by its form endpoint, or by sending the whole pet back.
    - any_of:
        - server: petstore
          method: POST
          path: /pet/{petId}
          path_parameters: {petId: '31'}
          query: {status: sold}
        - server: petstore
          method: PUT
          path: /pet
          body: {id: 31, status: sold}
  solution:
    - server: petstore
      operation: update_pet_with_form
      arguments: {petId: 31, status: sold}
  responses:
    - server: petstore
      method: GET
      path: /pet/findByStatus
      body:
        - {id: 31, name: Whiskers, category: {id: 2, name: Cats}, photoUrls: [], tags: [], status: available}
        - {id: 32, name: Mittens, category: {id: 2, name: Cats}, photoUrls: [], tags: [], status: available}
        - {id: 33, name: Rex, category: {id: 1, name: Dogs}, photoUrls: [], tags: [], status: available}
    - server: petstore
      method: GET
      path: /pet/31
      body: {id: 31, name: Whiskers, category: {id: 2, name: Cats}, photoUrls: [], tags: [], status: available}

- id: petstore-t03
  prompt: >-
    A customer just phoned to cancel their order, number 5. Please cancel it.
  split: test
  expected_calls:
    - server: petstore
      method: DELETE
      path: /store/order/{orderId}
      path_parameters: {orderId: '5'}
  solution:
    - server: petstore
      operation: delete_order
      arguments: {orderId: 5}

- id: petstore-t04
  prompt: >-
    A customer wants to buy Kiwi, the parrot we have up for sale. Place an order for one Kiwi, and mark Kiwi as pending so nobody else tries to buy her.
  split: test
  expected_calls:
    - server: petstore
      method: POST
      path: /store/order
      body: {petId: 52, quantity: 1}
    # Petstore sets a pet's status by its form endpoint, or by sending the whole pet back.
    - any_of:
        - server: petstore
          method: POST
          path: /pet/{petId}
          path_parameters: {petId: '52'}
          query: {status: pending}
        - server: petstore
          method: PUT
          path: /pet
          body: {id: 52, status: pending}
  solution:
    - server: petstore
      operation: place_order
      arguments: {petId: 52, quantity: 1, status: placed}
    - server: petstore
      operation: update_pet_with_form
      arguments: {petId: 52, status: pending}
  responses:
    - server: petstore
      method: GET
      path: /pet/findByStatus
      body:
        - {id: 51, name: Rio, category: {id: 4, name: Birds}, photoUrls: [], tags: [], status: available}
        - {id: 52, name: Kiwi, category: {id: 4, name: Birds}, photoUrls: [], tags: [], status: available}
        - {id: 53, name: Goldie, category: {id: 5, name: Fish}, photoUrls: [], tags: [], status: available}
    - server: petstore
      method: GET
      path: /pet/52
      body: {id: 52, name: Kiwi, category: {id: 4, name: Birds}, photoUrls: [], tags: [], status: available}

- id: petstore-t05
  prompt: >-
    Order 7 has been delivered to the customer. Look up which pet that order was for and mark that pet as sold.
  split: test
  expected_calls:
    - server: petstore
      method: GET
      path: /store/order/{orderId}
      path_parameters: {orderId: '7'}
    # Petstore sets a pet's status by its form endpoint, or by sending the whole pet back.
    - any_of:
        - server: petstore
          method: POST
          path: /pet/{petId}
          path_parameters: {petId: '88'}
          query: {status: sold}
        - server: petstore
          method: PUT
          path: /pet
          body: {id: 88, status: sold}
  solution:
    - server: petstore
      operation: get_order_by_id
      arguments: {orderId: 7}
    - server: petstore
      operation: update_pet_with_form
      arguments: {petId: 88, status: sold}
  responses:
    - server: petstore
      method: GET
      path: /store/order/7
      body: {id: 7, petId: 88, quantity: 1, shipDate: '2026-11-12T10:00:00Z', status: approved, complete: false}
    - server: petstore
      method: GET
      path: /store/order/8
      body: {id: 8, petId: 89, quantity: 1, shipDate: '2026-11-13T10:00:00Z', status: approved, complete: false}
    - server: petstore
      method: GET
      path: /pet/88
      body: {id: 88, name: Pepper, category: {id: 1, name: Dogs}, photoUrls: [], tags: [], status: pending}

- id: petstore-t06
  prompt: >-
    The customer behind order 9 backed out. Cancel the order, and put the pet it was for back up for sale as available.
  split: test
  expected_calls:
    - server: petstore
      method: GET
      path: /store/order/{orderId}
      path_parameters: {orderId: '9'}
    - server: petstore
      method: DELETE
      path: /store/order/{orderId}
      path_parameters: {orderId: '9'}
    # Petstore sets a pet's status by its form endpoint, or by sending the whole pet back.
    - any_of:
        - server: petstore
          method: POST
          path: /pet/{petId}
          path_parameters: {petId: '64'}
          query: {status: available}
        - server: petstore
          method: PUT
          path: /pet
          body: {id: 64, status: available}
  solution:
    - server: petstore
      operation: get_order_by_id
      arguments: {orderId: 9}
    - server: petstore
      operation: delete_order
      arguments: {orderId: 9}
    - server: petstore
      operation: update_pet_with_form
      arguments: {petId: 64, status: available}
  responses:
    - server: petstore
      method: GET
      path: /store/order/9
      body: {id: 9, petId: 64, quantity: 1, shipDate: '2026-11-20T10:00:00Z', status: placed, complete: false}
    - server: petstore
      method: GET
      path: /store/order/10
      body: {id: 10, petId: 65, quantity: 1, shipDate: '2026-11-21T10:00:00Z', status: placed, complete: false}
    - server: petstore
      method: GET
      path: /pet/64
      body: {id: 64, name: Mochi, category: {id: 2, name: Cats}, photoUrls: [], tags: [], status: pending}
