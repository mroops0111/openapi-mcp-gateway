- id: notion-t01
  prompt: 'In our Meeting Notes database (https://www.notion.so/acme/Meeting-Notes-3f1c2a9b8d7e4f60a1b2c3d4e5f60718),
    open the notes for "Q3 planning sync" and add a paragraph at the end saying: "Action item: Priya to share the
    revised hiring plan by Friday."'
  split: dev
  expected_calls:
  - server: notion
    method: PATCH
    path: /v1/blocks/{id}/children
    path_parameters:
      id: 9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d01
    body:
      children:
      - type: paragraph
        paragraph:
          rich_text:
          - text:
              content: 'Action item: Priya to share the revised hiring plan by Friday.'
  solution:
  - server: notion
    operation: append_block_children
    arguments:
      id: 9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d01
      children:
      - object: block
        type: paragraph
        paragraph:
          rich_text:
          - type: text
            text:
              content: 'Action item: Priya to share the revised hiring plan by Friday.'
  responses:
  - server: notion
    method: POST
    path: /v1/databases/{id}/query
    body:
      object: list
      has_more: false
      next_cursor: null
      results:
      - object: page
        id: 9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d01
        properties:
          Name:
            type: title
            title:
            - type: text
              plain_text: Q3 planning sync
              text:
                content: Q3 planning sync
          Date:
            type: date
            date:
              start: '2026-11-10'
      - object: page
        id: 9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d02
        properties:
          Name:
            type: title
            title:
            - type: text
              plain_text: Q2 planning sync
              text:
                content: Q2 planning sync
          Date:
            type: date
            date:
              start: '2026-08-04'
      - object: page
        id: 9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d03
        properties:
          Name:
            type: title
            title:
            - type: text
              plain_text: Weekly design review
              text:
                content: Weekly design review
          Date:
            type: date
            date:
              start: '2026-11-12'
  - server: notion
    method: PATCH
    path: /v1/blocks/9a1e5c0d-2b3f-4c6a-8d7e-1f2a3b4c5d01/children
    body: &id001
      object: list
      results: []
      has_more: false
      next_cursor: null

