servers:
  notion:
    instructions: |
      Use for a team's Notion notes. To find pages, call queryADatabase on the notes database
      (retrieveADatabase first to see its property names), then retrieveAPage or retrieveBlockChildren
      to read one. appendBlockChildren adds text to a page, updatePageProperties edits a database entry.
      Ids are UUIDs, with or without dashes.
    policy:
      allow:
      - retrieveADatabase
      - queryADatabase
      - retrieveAPage
      - retrieveBlockChildren
      - appendBlockChildren
      - updatePageProperties
    operations:
      retrieveADatabase:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      queryADatabase:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
          response: |
            {
              "results": [ results.{ "id": id, "url": url, "last_edited_time": last_edited_time, "archived": archived, "properties": properties } ],
              "has_more": has_more,
              "next_cursor": next_cursor
            }
      retrieveAPage:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      retrieveBlockChildren:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
            page_size:
              default: '50'
      updatePageProperties:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      appendBlockChildren:
        tool:
          description: Add text to the end of a Notion page (or block). Pass an optional heading and a list of paragraphs.
          params_strategy: replace
          params:
            page_id:
              type: string
              description: Id of the page (or block) to add content to.
            heading:
              type: string
              description: Optional heading placed before the paragraphs.
            paragraphs:
              type: array
              items:
                type: string
              description: Paragraph texts, each added as its own paragraph block, in order.
            Notion-Version:
              type: string
              hidden: true
              default: '2022-06-28'
          request: |
            {
              "id": page_id,
              "Notion-Version": "2022-06-28",
              "children": $append(
                heading ? [{ "object": "block", "type": "heading_2", "heading_2": { "rich_text": [{ "type": "text", "text": { "content": heading } }] } }] : [],
                [ paragraphs.{ "object": "block", "type": "paragraph", "paragraph": { "rich_text": [{ "type": "text", "text": { "content": $ } }] } } ]
              )
            }
          response: |
            { "added": $count(results), "block_ids": [ results.id ] }
