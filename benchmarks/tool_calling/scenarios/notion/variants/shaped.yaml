servers:
  notion:
    instructions: |
      Notion workspace notes. Pages and databases are only visible if they were shared with the integration.
      To find pages, call queryADatabase with a database id (optionally with a filter). To read a page, call
      retrieveAPage for its properties and retrieveBlockChildren (page id as the block id) for its content.
      To add content, call appendBlockChildren. To change a database entry, call updatePageProperties.
    policy:
      allow:
      - retrieveAPage
      - retrieveBlockChildren
      - appendBlockChildren
      - retrieveADatabase
      - queryADatabase
      - updatePageProperties
    operations:
      retrieveAPage:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      retrieveBlockChildren:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      retrieveADatabase:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      queryADatabase:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      updatePageProperties:
        tool:
          params_strategy: merge
          params:
            Notion-Version:
              hidden: true
              default: '2022-06-28'
      appendBlockChildren:
        tool:
          description: Add a new block of text (paragraph, heading, list item, to-do or quote) to the end of a page, or inside
            another block.
          params_strategy: replace
          params:
            id:
              type: string
              description: ID of the page (or parent block) to add the text to.
            text:
              type: string
              description: The text content of the new block.
            block_type:
              type: string
              enum:
              - paragraph
              - heading_1
              - heading_2
              - heading_3
              - bulleted_list_item
              - numbered_list_item
              - to_do
              - quote
              default: paragraph
              description: Kind of block to add.
            Notion-Version:
              type: string
              default: '2022-06-28'
              hidden: true
          request: |
            {
              "id": id,
              "Notion-Version": $lookup($, "Notion-Version"),
              "children": [
                {
                  "object": "block",
                  "type": $exists(block_type) ? block_type : "paragraph",
