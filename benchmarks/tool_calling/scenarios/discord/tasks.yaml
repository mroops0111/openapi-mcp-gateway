- id: discord-t04
  prompt: >-
    Someone posted a fake giveaway link in #general on our server (guild 81384788765712384), the message that says
    "FREE NITRO click here". Delete that message, leave everything else.
  split: test
  expected_calls:
    - server: discord
      method: DELETE
      path: /channels/{channel_id}/messages/{message_id}
      path_parameters: {channel_id: '400000000000000051', message_id: '500000000000000062'}
  # The request says to leave every other message alone.
  forbidden_calls:
    - server: discord
      method: DELETE
      path: /channels/{channel_id}/messages/{message_id}
      path_parameters: {message_id: '500000000000000061'}
    - server: discord
      method: DELETE
      path: /channels/{channel_id}/messages/{message_id}
      path_parameters: {message_id: '500000000000000063'}
    - server: discord
      method: POST
      path: /channels/{channel_id}/messages/bulk-delete
  solution:
    - server: discord
      operation: delete_message
      arguments: {channel_id: '400000000000000051', message_id: '500000000000000062'}
  responses:
    - server: discord
      method: GET
      path: /guilds/81384788765712384/channels
      body:
        - &discord-t04-channel50 {id: '400000000000000050', name: announcements, type: 0, guild_id: '81384788765712384'}
        - &discord-t04-channel51 {id: '400000000000000051', name: general, type: 0, guild_id: '81384788765712384'}
        - &discord-t04-channel52 {id: '400000000000000052', name: general-offtopic, type: 0, guild_id: '81384788765712384'}
    - server: discord
      method: GET
      path: /channels/400000000000000050
      body: *discord-t04-channel50
    - server: discord
      method: GET
      path: /channels/400000000000000051
      body: *discord-t04-channel51
    - server: discord
      method: GET
      path: /channels/400000000000000052
      body: *discord-t04-channel52
    - server: discord
      method: GET
      path: /channels/400000000000000051/messages
      body:
        - &discord-t04-message61 {id: '500000000000000061', channel_id: '400000000000000051', content: "anyone up for a game tonight?", author: {id: '200000000000000013', username: brightowl}}
        - &discord-t04-message62 {id: '500000000000000062', channel_id: '400000000000000051', content: "FREE NITRO click here https://dlscord-gift.example/claim", author: {id: '200000000000000077', username: giftbot}}
        - &discord-t04-message63 {id: '500000000000000063', channel_id: '400000000000000051', content: "is the free nitro link real? looks sketchy", author: {id: '200000000000000011', username: quietfox}}
    - server: discord
      method: GET
      path: /channels/400000000000000051/messages/500000000000000061
      body: *discord-t04-message61
    - server: discord
      method: GET
      path: /channels/400000000000000051/messages/500000000000000062
      body: *discord-t04-message62
    - server: discord
      method: GET
      path: /channels/400000000000000051/messages/500000000000000063
      body: *discord-t04-message63
    # One search answers whatever query the model writes, with the same messages, each in a list of its own.
    - server: discord
      method: GET
      path: /guilds/81384788765712384/messages/search
      body:
        messages: [[*discord-t04-message61], [*discord-t04-message62], [*discord-t04-message63]]
        total_results: 3
        doing_deep_historical_index: false
        threads: []
        members: []
