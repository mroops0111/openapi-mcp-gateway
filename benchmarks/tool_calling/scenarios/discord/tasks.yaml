- id: discord-t01
  prompt: >-
    In our server (guild 81384788765712384), give the member quietfox the Helper role. They've been answering
    questions in support for weeks.
  split: dev
  expected_calls:
    # quietfox has no roles yet, so setting their roles to Helper alone adds it as well.
    - any_of:
        - server: discord
          method: PUT
          path: /guilds/{guild_id}/members/{user_id}/roles/{role_id}
          path_parameters: {guild_id: '81384788765712384', user_id: '200000000000000011', role_id: '300000000000000021'}
        - server: discord
          method: PATCH
          path: /guilds/{guild_id}/members/{user_id}
          path_parameters: {guild_id: '81384788765712384', user_id: '200000000000000011'}
          body: {roles: ['300000000000000021']}
  solution:
    - server: discord
      operation: add_guild_member_role
      arguments: {guild_id: '81384788765712384', user_id: '200000000000000011', role_id: '300000000000000021'}
  responses:
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/search
      body:
        - &discord-t01-member11 {user: &discord-t01-user11 {id: '200000000000000011', username: quietfox, global_name: Quiet Fox}, nick: null, roles: []}
        - &discord-t01-member12 {user: &discord-t01-user12 {id: '200000000000000012', username: quietfox_alt, global_name: Not Quiet}, nick: null, roles: []}
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members
      body:
        - *discord-t01-member11
        - *discord-t01-member12
        - &discord-t01-member13 {user: &discord-t01-user13 {id: '200000000000000013', username: brightowl, global_name: Bright Owl}, nick: null, roles: []}
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/200000000000000011
      body: *discord-t01-member11
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/200000000000000012
      body: *discord-t01-member12
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/200000000000000013
      body: *discord-t01-member13
    - server: discord
      method: GET
      path: /users/200000000000000011
      body: *discord-t01-user11
    - server: discord
      method: GET
      path: /users/200000000000000012
      body: *discord-t01-user12
    - server: discord
      method: GET
      path: /users/200000000000000013
      body: *discord-t01-user13
    - server: discord
      method: PATCH
      path: /guilds/81384788765712384/members/200000000000000011
      body: {<<: *discord-t01-member11, roles: ['300000000000000021']}
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles
      body: &discord-roles
        - &discord-role-everyone {id: '81384788765712384', name: '@everyone', position: 0, permissions: '0'}
        - &discord-role-helper {id: '300000000000000021', name: Helper, position: 2, permissions: '0'}
        - &discord-role-trainee {id: '300000000000000022', name: Helper Trainee, position: 1, permissions: '0'}
        - &discord-role-moderator {id: '300000000000000023', name: Moderator, position: 3, permissions: '0'}
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles/81384788765712384
      body: *discord-role-everyone
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles/300000000000000021
      body: *discord-role-helper
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles/300000000000000022
      body: *discord-role-trainee
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles/300000000000000023
      body: *discord-role-moderator
    # The guild every task works in, which later tasks share.
    - server: discord
      method: GET
      path: /guilds/81384788765712384
      body: &discord-guild {id: '81384788765712384', name: Night Owls, owner_id: '200000000000000090', roles: *discord-roles}
    - server: discord
      method: GET
      path: /users/@me/guilds
      body: &discord-my-guilds
        - {id: '81384788765712384', name: Night Owls, owner: false, permissions: '268435462'}

- id: discord-t02
  prompt: >-
    The account spambot_9000 just flooded our server (guild 81384788765712384) with scam links. Ban them and wipe
    their messages from the last 24 hours.
  split: dev
  expected_calls:
    # A ban may wipe a day of messages in seconds or in the older days field, or come from a bulk ban of them alone.
    - any_of:
        - server: discord
          method: PUT
          path: /guilds/{guild_id}/bans/{user_id}
          path_parameters: {guild_id: '81384788765712384', user_id: '200000000000000031'}
          body: {delete_message_seconds: 86400}
        - server: discord
          method: PUT
          path: /guilds/{guild_id}/bans/{user_id}
          path_parameters: {guild_id: '81384788765712384', user_id: '200000000000000031'}
          body: {delete_message_days: 1}
        - server: discord
          method: POST
          path: /guilds/{guild_id}/bulk-ban
          path_parameters: {guild_id: '81384788765712384'}
          body: {user_ids: ['200000000000000031'], delete_message_seconds: 86400}
  # spambot_hunter only shares the name, so banning them too is wrong, by either endpoint.
  forbidden_calls:
    - server: discord
      method: PUT
      path: /guilds/{guild_id}/bans/{user_id}
      path_parameters: {user_id: '200000000000000032'}
    - server: discord
      method: POST
      path: /guilds/{guild_id}/bulk-ban
      body: {user_ids: ['200000000000000032']}
  solution:
    - server: discord
      operation: ban_user_from_guild
      arguments: {guild_id: '81384788765712384', user_id: '200000000000000031', delete_message_seconds: 86400}
  responses:
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/search
      body: &discord-t02-members
        - &discord-t02-member31 {user: &discord-t02-user31 {id: '200000000000000031', username: spambot_9000, global_name: Free Nitro}, nick: null, roles: []}
        - &discord-t02-member32 {user: &discord-t02-user32 {id: '200000000000000032', username: spambot_hunter, global_name: Spam Hunter}, nick: null, roles: []}
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members
      body: *discord-t02-members
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/200000000000000031
      body: *discord-t02-member31
    - server: discord
      method: GET
      path: /guilds/81384788765712384/members/200000000000000032
      body: *discord-t02-member32
    - server: discord
      method: GET
      path: /users/200000000000000031
      body: *discord-t02-user31
    - server: discord
      method: GET
      path: /users/200000000000000032
      body: *discord-t02-user32
    # Nobody is banned yet.
    - server: discord
      method: GET
      path: /guilds/81384788765712384/bans
      body: []
    - server: discord
      method: GET
      path: /guilds/81384788765712384/bans/{user_id}
      status: 404
      body: {message: Unknown Ban, code: 10026}
    - server: discord
      method: POST
      path: /guilds/81384788765712384/bulk-ban
      body: {banned_users: ['200000000000000031'], failed_users: []}
    - server: discord
      method: GET
      path: /guilds/81384788765712384
      body: *discord-guild
    - server: discord
      method: GET
      path: /users/@me/guilds
      body: *discord-my-guilds

