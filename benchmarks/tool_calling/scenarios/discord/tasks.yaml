      body: *discord-my-guilds

- id: discord-t05
  prompt: >-
    Create a new role called "Event Staff" in guild 81384788765712384. It should show separately in the member list
    and people should be able to @mention it.
  split: test
  expected_calls:
    # The role may be created with every setting, or created and then given the settings it lacks.
    - any_of:
        - server: discord
          method: POST
          path: /guilds/{guild_id}/roles
          path_parameters: {guild_id: '81384788765712384'}
          body: {name: Event Staff, hoist: true, mentionable: true}
        - all_of:
            - server: discord
              method: POST
              path: /guilds/{guild_id}/roles
              path_parameters: {guild_id: '81384788765712384'}
              body: {name: Event Staff}
            - server: discord
              method: PATCH
              path: /guilds/{guild_id}/roles/{role_id}
              path_parameters: {guild_id: '81384788765712384', role_id: '300000000000000025'}
              body: {hoist: true, mentionable: true}
        - all_of:
            - server: discord
              method: POST
              path: /guilds/{guild_id}/roles
              path_parameters: {guild_id: '81384788765712384'}
              body: {name: Event Staff, hoist: true}
            - server: discord
              method: PATCH
              path: /guilds/{guild_id}/roles/{role_id}
              path_parameters: {guild_id: '81384788765712384', role_id: '300000000000000025'}
              body: {mentionable: true}
        - all_of:
            - server: discord
              method: POST
              path: /guilds/{guild_id}/roles
              path_parameters: {guild_id: '81384788765712384'}
              body: {name: Event Staff, mentionable: true}
            - server: discord
              method: PATCH
              path: /guilds/{guild_id}/roles/{role_id}
              path_parameters: {guild_id: '81384788765712384', role_id: '300000000000000025'}
              body: {hoist: true}
  solution:
    - server: discord
      operation: create_guild_role
      arguments: {guild_id: '81384788765712384', name: Event Staff, hoist: true, mentionable: true}
  responses:
    # No Event Staff role exists yet.
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles
      body: *discord-roles
    # The new role gets this id, which a follow-up update names.
    - server: discord
      method: POST
      path: /guilds/81384788765712384/roles
      body: &discord-t05-role {id: '300000000000000025', name: Event Staff, position: 1, permissions: '0', color: 0, hoist: true, mentionable: true, managed: false}
    - server: discord
      method: PATCH
      path: /guilds/81384788765712384/roles/300000000000000025
      body: *discord-t05-role
    - server: discord
      method: GET
      path: /guilds/81384788765712384/roles/300000000000000025
      body: *discord-t05-role
    - server: discord
      method: GET
      path: /guilds/81384788765712384
      body: *discord-guild
    - server: discord
      method: GET
      path: /users/@me/guilds
      body: *discord-my-guilds

