servers:
  discord:
    instructions: |
      Moderation tools for one Discord server (guild). Ids are numeric snowflake strings.
      Start with list_guild_channels, list_guild_roles or search_guild_members to find the ids
      you need before changing anything. Kicks, bans, channel deletes and message deletes are
      not reversible, so confirm the target first.
    policy:
      allow:
      - list_guild_members
      - search_guild_members
      - get_guild_member
      - update_guild_member
      - delete_guild_member
      - add_guild_member_role
      - delete_guild_member_role
      - list_guild_bans
      - get_guild_ban
      - ban_user_from_guild
      - unban_user_from_guild
      - list_guild_roles
      - get_guild_role
      - create_guild_role
      - update_guild_role
      - delete_guild_role
      - list_guild_channels
      - get_channel
      - create_guild_channel
      - update_channel
      - delete_channel
      - list_messages
      - get_message
      - delete_message
      - bulk_delete_messages
      - list_pins
      - create_pin
      - delete_pin
      - create_message
    operations:
      list_messages:
        tool:
          params_strategy: merge
          params:
            limit:
              default: 50
              description: How many messages to return, newest first (1-100).
            before:
              description: Only messages older than this message id. Use it to page back.
          response: |
            [ $.{
              "id": id,
              "author": author.username,
              "author_id": author.id,
              "content": content,
              "timestamp": timestamp,
              "pinned": pinned,
              "attachments": $count(attachments)
            } ]
      bulk_delete_messages:
        tool:
          description: Delete 2 to 100 messages from a channel in one call. Discord refuses messages older than 14 days.
      list_guild_members:
        tool:
          params_strategy: merge
          params:
            limit:
              default: 100
              description: How many members to return (1-1000).
            after:
              description: Return members after this user id. Use the last user id of the previous page.
          response: |
            [ $.{
              "user_id": user.id,
              "username": user.username,
              "nick": nick,
              "roles": roles,
              "joined_at": joined_at,
              "timeout_until": communication_disabled_until
            } ]
      search_guild_members:
        tool:
          params_strategy: merge
          params:
            limit:
              default: 10
          response: |
            [ $.{
              "user_id": user.id,
              "username": user.username,
              "nick": nick,
              "roles": roles,
              "joined_at": joined_at
            } ]
      update_guild_member:
        tool:
          params_strategy: merge
          params:
            communication_disabled_until:
              description: ISO 8601 UTC time when the timeout ends, for example 2030-01-01T12:00:00Z. At most 28 days ahead.
            roles:
              description: Replaces the member's WHOLE role list. To add or remove one role use add_guild_member_role or delete_guild_member_role
                instead.
      ban_user_from_guild:
        tool:
          description: Ban a user from the server, optionally removing their recent messages.
          params_strategy: replace
          params:
            guild_id:
              type: string
              description: Server id.
            user_id:
              type: string
              description: Id of the user to ban.
            delete_recent_messages:
              type: string
              enum:
              - none
              - last_hour
              - last_day
              - last_week
              default: none
              description: How much of the user's message history to delete along with the ban.
          request: |
            {
              "guild_id": guild_id,
              "user_id": user_id,
              "delete_message_seconds": $lookup({"none": 0, "last_hour": 3600, "last_day": 86400, "last_week": 604800}, delete_recent_messages ? delete_recent_messages : "none")
            }
      list_guild_roles:
        tool:
          response: |
            [ $.{
              "id": id,
              "name": name,
              "position": position,
              "permissions": permissions,
              "managed": managed,
              "mentionable": mentionable,
              "hoist": hoist
            } ]
      list_guild_channels:
        tool:
          response: |
            [ $.{
              "id": id,
              "name": name,
              "kind": $lookup({"0": "text", "2": "voice", "4": "category", "5": "announcement", "13": "stage", "15": "forum", "16": "media"}, $string(type)),
              "type": type,
              "parent_id": parent_id,
              "position": position,
              "topic": topic,
              "nsfw": nsfw
            } ]
