servers:
  github:
    instructions: |
      Triage issues and review pull requests in GitHub repositories.
      Every tool needs `owner` and `repo`. GitHub treats pull requests as issues, so
      issues_list_for_repo also returns pull requests (marked is_pull_request: true).
      To review a PR: pulls/get, then pulls/list-files, then pulls/create-review.
      To triage: issues/list-for-repo, issues/get, then issues/add-labels, issues/add-assignees, or issues/create-comment.
    policy:
      allow:
      - issues/list-for-repo
      - issues/get
      - issues/create
      - issues/update
      - issues/list-comments
      - issues/create-comment
      - issues/list-labels-for-repo
      - issues/add-labels
      - issues/list-assignees
      - issues/add-assignees
      - pulls/list
      - pulls/get
      - pulls/list-files
      - pulls/list-commits
      - pulls/list-reviews
      - pulls/list-review-comments
      - pulls/create-review
      - pulls/request-reviewers
    operations:
      issues/list-for-repo:
        tool:
          params_strategy: merge
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "author": user.login,
              "labels": [labels.($type($) = "string" ? $ : name)],
              "assignees": [assignees.login],
              "comments": comments,
              "is_pull_request": $exists(pull_request),
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            } ]
      issues/get:
        tool:
          response: |
            {
              "number": number,
              "title": title,
              "state": state,
              "author": user.login,
              "body": body,
              "labels": [labels.($type($) = "string" ? $ : name)],
              "assignees": [assignees.login],
              "milestone": milestone.title,
              "comments": comments,
              "is_pull_request": $exists(pull_request),
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            }
      issues/create:
        tool:
          response: |
            { "number": number, "title": title, "state": state, "url": html_url }
      issues/update:
        tool:
          response: |
            {
              "number": number,
              "title": title,
              "state": state,
              "labels": [labels.($type($) = "string" ? $ : name)],
              "assignees": [assignees.login],
              "url": html_url
            }
      issues/list-comments:
        tool:
          response: |
            [ $.{ "id": id, "author": user.login, "body": body, "created_at": created_at, "url": html_url } ]
      issues/create-comment:
        tool:
          response: |
            { "id": id, "url": html_url }
      issues/list-labels-for-repo:
        tool:
          response: |
            [ $.{ "name": name, "description": description } ]
      issues/add-labels:
        tool:
          response: |
            [ $.name ]
      issues/list-assignees:
        tool:
          response: |
            [ $.login ]
      issues/add-assignees:
        tool:
          response: |
            { "number": number, "assignees": [assignees.login], "url": html_url }
      pulls/list:
        tool:
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "draft": draft,
              "author": user.login,
              "head": head.ref,
              "base": base.ref,
              "labels": [labels.name],
              "requested_reviewers": [requested_reviewers.login],
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            } ]
      pulls/get:
        tool:
          response: |
            {
              "number": number,
              "title": title,
              "state": state,
              "draft": draft,
              "merged": merged,
              "mergeable": mergeable,
              "mergeable_state": mergeable_state,
              "author": user.login,
              "body": body,
              "head": head.ref,
              "head_sha": head.sha,
              "base": base.ref,
              "labels": [labels.name],
              "requested_reviewers": [requested_reviewers.login],
              "commits": commits,
              "changed_files": changed_files,
              "additions": additions,
              "deletions": deletions,
              "comments": comments,
              "review_comments": review_comments,
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            }
      pulls/list-files:
        tool:
          response: |
            [ $.{
              "filename": filename,
              "status": status,
              "additions": additions,
              "deletions": deletions,
              "patch": patch
            } ]
      pulls/list-commits:
        tool:
          response: |
            [ $.{
              "sha": sha,
              "message": commit.message,
              "author": author.login,
              "date": commit.author.date
            } ]
      pulls/list-reviews:
        tool:
          response: |
            [ $.{
              "id": id,
              "author": user.login,
              "state": state,
              "body": body,
              "commit_id": commit_id,
              "submitted_at": submitted_at
            } ]
      pulls/list-review-comments:
        tool:
          response: |
            [ $.{
              "id": id,
              "author": user.login,
              "path": path,
              "line": line,
              "side": side,
              "body": body,
              "in_reply_to_id": in_reply_to_id,
              "created_at": created_at
            } ]
      pulls/create-review:
        tool:
          params_strategy: merge
          params:
            event:
              default: COMMENT
          response: |
            { "id": id, "state": state, "url": html_url }
      pulls/request-reviewers:
        tool:
          response: |
            {
              "number": number,
              "requested_reviewers": [requested_reviewers.login],
              "url": html_url
            }
