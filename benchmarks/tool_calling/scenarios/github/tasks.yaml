- id: github-t01
  prompt: >-
    Can you ask alice-chen to review the "Add rate limiting to API client" pull request in acme/api?
  split: dev
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/pulls/{pull_number}/requested_reviewers
      path_parameters: {owner: acme, repo: api, pull_number: '87'}
      body: {reviewers: [alice-chen]}
  solution:
    - server: github
      operation: pulls_request_reviewers
      arguments: {owner: acme, repo: api, pull_number: 87, reviewers: [alice-chen]}
  responses:
    - server: github
      method: GET
      path: /repos/acme/api/pulls
      body:
        - &github-t01-pr86 {number: 86, title: Add retry logic to API client, state: open, user: {login: dev-sam}, requested_reviewers: []}
        - &github-t01-pr87 {number: 87, title: Add rate limiting to API client, state: open, user: {login: priya-k}, requested_reviewers: []}
        - &github-t01-pr88 {number: 88, title: Update README badges, state: open, user: {login: dev-sam}, requested_reviewers: []}
    - server: github
      method: GET
      path: /repos/acme/api/pulls/86
      body: *github-t01-pr86
    - server: github
      method: GET
      path: /repos/acme/api/pulls/87
      body: *github-t01-pr87
    - server: github
      method: GET
      path: /repos/acme/api/pulls/88
      body: *github-t01-pr88
    # The issues endpoints list a pull request as an issue carrying a pull_request key.
    - server: github
      method: GET
      path: /repos/acme/api/issues
      body: &github-t01-pr-issues
        - &github-t01-issue86 {<<: *github-t01-pr86, repository_url: https://api.github.com/repos/acme/api, pull_request: {url: https://api.github.com/repos/acme/api/pulls/86}}
        - &github-t01-issue87 {<<: *github-t01-pr87, repository_url: https://api.github.com/repos/acme/api, pull_request: {url: https://api.github.com/repos/acme/api/pulls/87}}
        - &github-t01-issue88 {<<: *github-t01-pr88, repository_url: https://api.github.com/repos/acme/api, pull_request: {url: https://api.github.com/repos/acme/api/pulls/88}}
    - server: github
      method: GET
      path: /repos/acme/api/issues/86
      body: *github-t01-issue86
    - server: github
      method: GET
      path: /repos/acme/api/issues/87
      body: *github-t01-issue87
    - server: github
      method: GET
      path: /repos/acme/api/issues/88
      body: *github-t01-issue88
    # One search answers whatever query the model writes, with the same pull requests.
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 3, incomplete_results: false, items: *github-t01-pr-issues}
    - server: github
      method: GET
      path: /repos/acme/api/pulls/{pull_number}/requested_reviewers
      body: {users: [], teams: []}
    - server: github
      method: POST
      path: /repos/acme/api/pulls/87/requested_reviewers
      status: 201
      body: {<<: *github-t01-pr87, requested_reviewers: [{login: alice-chen, type: User}]}
    - server: github
      method: GET
      path: /repos/acme/api
      body: &github-t01-repo {id: 1296269, name: api, full_name: acme/api, owner: {login: acme, type: Organization}, private: true, default_branch: main}
    - server: github
      method: GET
      path: /search/repositories
      body: {total_count: 1, incomplete_results: false, items: [*github-t01-repo]}
    # alice-chen can be asked for a review, as a collaborator on the repository.
    - server: github
      method: GET
      path: /repos/acme/api/collaborators
      body: &github-t01-people
        - {login: alice-chen, id: 7100001, type: User}
        - {login: dev-sam, id: 7100002, type: User}
        - {login: priya-k, id: 7100003, type: User}
    - server: github
      method: GET
      path: /repos/acme/api/assignees
      body: *github-t01-people
    - server: github
      method: GET
      path: /orgs/acme/members
      body: *github-t01-people
    - server: github
      method: GET
      path: /repos/acme/api/collaborators/alice-chen
      status: 204
    - server: github
      method: GET
      path: /repos/acme/api/assignees/alice-chen
      status: 204
    - server: github
      method: GET
      path: /users/alice-chen
      body: {login: alice-chen, id: 7100001, type: User, name: Alice Chen}

- id: github-t02
  prompt: >-
    The issue "App crashes when uploading large photos" in acme/mobile was closed too early, it still happens on the latest build. Reopen it.
  split: dev
  expected_calls:
    - server: github
      method: PATCH
      path: /repos/{owner}/{repo}/issues/{issue_number}
      path_parameters: {owner: acme, repo: mobile, issue_number: '77'}
      body: {state: open}
  solution:
    - server: github
      operation: issues_update
      arguments: {owner: acme, repo: mobile, issue_number: 77, state: open}
  responses:
    - server: github
      method: GET
      path: /repos/acme/mobile/issues
      body: &github-t02-issues
        - &github-t02-issue76 {number: 76, title: App crashes on launch on Android 12, state: closed, user: {login: priya-k}, labels: [], assignees: [], repository_url: https://api.github.com/repos/acme/mobile}
        - &github-t02-issue77 {number: 77, title: App crashes when uploading large photos, state: closed, state_reason: completed, user: {login: dev-sam}, labels: [], assignees: [], repository_url: https://api.github.com/repos/acme/mobile}
        - &github-t02-issue78 {number: 78, title: Add dark mode to settings screen, state: open, user: {login: alice-chen}, labels: [], assignees: [], repository_url: https://api.github.com/repos/acme/mobile}
    - server: github
      method: GET
      path: /repos/acme/mobile/issues/76
      body: *github-t02-issue76
    - server: github
      method: GET
      path: /repos/acme/mobile/issues/77
      body: *github-t02-issue77
    - server: github
      method: GET
      path: /repos/acme/mobile/issues/78
      body: *github-t02-issue78
    # One search answers whatever query the model writes, with the same issues.
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 3, incomplete_results: false, items: *github-t02-issues}
    - server: github
      method: PATCH
      path: /repos/acme/mobile/issues/77
      body: {<<: *github-t02-issue77, state: open, state_reason: reopened}
    - server: github
      method: GET
      path: /repos/acme/mobile
      body: &github-t02-repo {id: 1296270, name: mobile, full_name: acme/mobile, owner: {login: acme, type: Organization}, private: true, default_branch: main}
    - server: github
      method: GET
      path: /search/repositories
      body: {total_count: 1, incomplete_results: false, items: [*github-t02-repo]}

