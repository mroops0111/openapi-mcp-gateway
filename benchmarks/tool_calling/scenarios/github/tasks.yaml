- id: github-t04
  prompt: >-
    I've looked over the "Migrate push notifications to FCM v1" pull request in acme/mobile and it's good to go. Approve it with a short note saying "LGTM, thanks!".
  split: test
  expected_calls:
    # A review may be approved as it is created, or created pending and then submitted as an approval.
    - any_of:
        - server: github
          method: POST
          path: /repos/{owner}/{repo}/pulls/{pull_number}/reviews
          path_parameters: {owner: acme, repo: mobile, pull_number: '142'}
          body: {event: APPROVE}
        - all_of:
            - server: github
              method: POST
              path: /repos/{owner}/{repo}/pulls/{pull_number}/reviews
              path_parameters: {owner: acme, repo: mobile, pull_number: '142'}
            - server: github
              method: POST
              path: /repos/{owner}/{repo}/pulls/{pull_number}/reviews/{review_id}/events
              path_parameters: {owner: acme, repo: mobile, pull_number: '142'}
              body: {event: APPROVE}
  solution:
    - server: github
      operation: pulls_create_review
      arguments: {owner: acme, repo: mobile, pull_number: 142, event: APPROVE, body: "LGTM, thanks!"}
  responses:
    - server: github
      method: GET
      path: /repos/acme/mobile/pulls
      body:
        - &github-t04-pr141 {number: 141, title: Migrate analytics to Firebase v10, state: open, user: {login: priya-k}, requested_reviewers: []}
        - &github-t04-pr142 {number: 142, title: Migrate push notifications to FCM v1, state: open, user: {login: dev-sam}, requested_reviewers: []}
    - server: github
      method: GET
      path: /repos/acme/mobile/pulls/141
      body: *github-t04-pr141
    - server: github
      method: GET
      path: /repos/acme/mobile/pulls/142
      body: *github-t04-pr142
    # The issues endpoints list a pull request as an issue carrying a pull_request key.
    - server: github
      method: GET
      path: /repos/acme/mobile/issues
      body: &github-t04-pr-issues
        - &github-t04-issue141 {<<: *github-t04-pr141, repository_url: https://api.github.com/repos/acme/mobile, pull_request: {url: https://api.github.com/repos/acme/mobile/pulls/141}}
        - &github-t04-issue142 {<<: *github-t04-pr142, repository_url: https://api.github.com/repos/acme/mobile, pull_request: {url: https://api.github.com/repos/acme/mobile/pulls/142}}
    - server: github
      method: GET
      path: /repos/acme/mobile/issues/141
      body: *github-t04-issue141
    - server: github
      method: GET
      path: /repos/acme/mobile/issues/142
      body: *github-t04-issue142
    # One search answers whatever query the model writes, with the same pull requests.
    - server: github
      method: GET
      path: /search/issues
      body: {total_count: 2, incomplete_results: false, items: *github-t04-pr-issues}
    - server: github
      method: GET
      path: /repos/acme/mobile/pulls/{pull_number}/reviews
      body: []
    # The spec's sample review requests changes, which would read as the approval failing.
    - server: github
      method: POST
      path: /repos/acme/mobile/pulls/142/reviews
      body: &github-t04-review {id: 80142, user: {login: acme-bot, type: Bot}, body: "LGTM, thanks!", state: APPROVED, pull_request_url: https://api.github.com/repos/acme/mobile/pulls/142}
    - server: github
      method: POST
      path: /repos/acme/mobile/pulls/142/reviews/{review_id}/events
      body: *github-t04-review
    - server: github
      method: GET
      path: /repos/acme/mobile
      body: &github-t04-repo {id: 1296270, name: mobile, full_name: acme/mobile, owner: {login: acme, type: Organization}, private: true, default_branch: main}
    - server: github
      method: GET
      path: /search/repositories
      body: {total_count: 1, incomplete_results: false, items: [*github-t04-repo]}

