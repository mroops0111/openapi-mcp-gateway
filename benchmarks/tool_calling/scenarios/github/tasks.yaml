- id: github-t01
  prompt: >-
    Can you ask alice-chen to review the "Add rate limiting to API client" pull request in acme/api?
  split: dev
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/pulls/{pull_number}/requested_reviewers
      path_parameters: {owner: acme, repo: api, pull_number: '87'}
      body: {reviewers: [alice-chen]}
  solution:
    - server: github
      operation: pulls_request_reviewers
      arguments: {owner: acme, repo: api, pull_number: 87, reviewers: [alice-chen]}
  responses:
    - server: github
      method: GET
      path: /repos/acme/api/pulls
      body:
        - {number: 86, title: Add retry logic to API client, state: open}
        - {number: 87, title: Add rate limiting to API client, state: open}
        - {number: 88, title: Update README badges, state: open}

- id: github-t02
  prompt: >-
    The issue "App crashes when uploading large photos" in acme/mobile was closed too early, it still happens on the latest build. Reopen it.
  split: dev
  expected_calls:
    - server: github
      method: PATCH
      path: /repos/{owner}/{repo}/issues/{issue_number}
      path_parameters: {owner: acme, repo: mobile, issue_number: '77'}
      body: {state: open}
  solution:
    - server: github
      operation: issues_update
      arguments: {owner: acme, repo: mobile, issue_number: 77, state: open}
  responses:
    - server: github
      method: GET
      path: /repos/acme/mobile/issues
      body:
        - {number: 76, title: App crashes on launch on Android 12, state: closed}
        - {number: 77, title: App crashes when uploading large photos, state: closed}
        - {number: 78, title: Add dark mode to settings screen, state: open}

- id: github-t03
  prompt: >-
    The issue "Dark mode toggle resets on reload" in acme/web was fixed by the settings refactor. Close it as completed.
  split: test
  expected_calls:
    - server: github
      method: PATCH
      path: /repos/{owner}/{repo}/issues/{issue_number}
      path_parameters: {owner: acme, repo: web, issue_number: '214'}
      body: {state: closed}
  solution:
    - server: github
      operation: issues_update
      arguments: {owner: acme, repo: web, issue_number: 214, state: closed, state_reason: completed}
  responses:
    - server: github
      method: GET
      path: /repos/acme/web/issues
      body:
        - {number: 213, title: Dark mode colors too dim on charts, state: open}
        - {number: 214, title: Dark mode toggle resets on reload, state: open}
        - {number: 215, title: Footer links broken on mobile, state: open}

- id: github-t04
  prompt: >-
    I've looked over the "Migrate push notifications to FCM v1" pull request in acme/mobile and it's good to go. Approve it with a short note saying "LGTM, thanks!".
  split: test
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/pulls/{pull_number}/reviews
      path_parameters: {owner: acme, repo: mobile, pull_number: '142'}
      body: {event: APPROVE}
  solution:
    - server: github
      operation: pulls_create_review
      arguments: {owner: acme, repo: mobile, pull_number: 142, event: APPROVE, body: "LGTM, thanks!"}
  responses:
    - server: github
      method: GET
      path: /repos/acme/mobile/pulls
      body:
        - {number: 141, title: Migrate analytics to Firebase v10, state: open}
        - {number: 142, title: Migrate push notifications to FCM v1, state: open}

- id: github-t05
  prompt: >-
    Leave a comment on the "Search returns stale results after reindex" issue in acme/api asking the reporter which version they're running.
  split: test
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/issues/{issue_number}/comments
      path_parameters: {owner: acme, repo: api, issue_number: '305'}
  solution:
    - server: github
      operation: issues_create_comment
      arguments: {owner: acme, repo: api, issue_number: 305, body: "Thanks for the report! Which version are you running?"}
  responses:
    - server: github
      method: GET
      path: /repos/acme/api/issues
      body:
        - {number: 304, title: Search is slow for long queries, state: open}
        - {number: 305, title: Search returns stale results after reindex, state: open}
        - {number: 306, title: Reindex job fails on empty index, state: open}

- id: github-t06
  prompt: >-
    dev-sam will look into the "Webhook retries ignore backoff setting" issue in acme/api. Assign it to them.
  split: test
  expected_calls:
    - server: github
      method: POST
      path: /repos/{owner}/{repo}/issues/{issue_number}/assignees
      path_parameters: {owner: acme, repo: api, issue_number: '318'}
      body: {assignees: [dev-sam]}
  solution:
    - server: github
      operation: issues_add_assignees
      arguments: {owner: acme, repo: api, issue_number: 318, assignees: [dev-sam]}
  responses:
    - server: github
      method: GET
      path: /repos/acme/api/issues
      body:
        - {number: 317, title: Webhook payloads missing event id, state: open}
        - {number: 318, title: Webhook retries ignore backoff setting, state: open}
        - {number: 319, title: Backoff setting not shown in dashboard, state: open}
