servers:
  stripe:
    instructions: |
      Shop billing through Stripe. Amounts are integers in the currency's smallest unit (1000 = 10.00 USD).
      Find the customer first (list_customers with an email filter), then look at their subscriptions,
      invoices and refunds. To refund, you need the charge id or payment intent id (see the invoice).
      Refunds, invoice payment/voiding and subscription cancellation move money or cannot be undone: confirm with the user first.
    policy:
      allow:
      - GetCustomers
      - GetCustomersCustomer
      - PostCustomers
      - PostCustomersCustomer
      - GetSubscriptions
      - GetSubscriptionsSubscriptionExposedId
      - PostSubscriptions
      - PostSubscriptionsSubscriptionExposedId
      - DeleteSubscriptionsSubscriptionExposedId
      - GetInvoices
      - GetInvoicesInvoice
      - PostInvoices
      - PostInvoicesInvoiceFinalize
      - PostInvoicesInvoiceSend
      - PostInvoicesInvoicePay
      - PostInvoicesInvoiceVoid
      - GetRefunds
      - GetRefundsRefund
      - PostRefunds
      - PostRefundsRefundCancel
    operations:
      GetCustomers:
        tool:
          response: |
            {
              "customers": [data.{"id": id, "name": name, "email": email, "created": created, "currency": currency, "balance": balance, "delinquent": delinquent}],
              "has_more": has_more
            }
      GetSubscriptions:
        tool:
          response: |
            {
              "subscriptions": [data.{"id": id, "customer": customer, "status": status, "currency": currency, "cancel_at_period_end": cancel_at_period_end, "created": created, "items": [items.data.{"price_id": price.id, "quantity": quantity}]}],
              "has_more": has_more
            }
      GetInvoices:
        tool:
          response: |
            {
              "invoices": [data.{"id": id, "number": number, "customer": customer, "customer_email": customer_email, "status": status, "currency": currency, "total": total, "amount_due": amount_due, "amount_paid": amount_paid, "created": created, "due_date": due_date, "hosted_invoice_url": hosted_invoice_url}],
              "has_more": has_more
            }
      GetRefunds:
        tool:
          response: |
            {
              "refunds": [data.{"id": id, "amount": amount, "currency": currency, "status": status, "reason": reason, "charge": charge, "payment_intent": payment_intent, "created": created}],
              "has_more": has_more
            }
      PostRefunds:
        tool:
          description: Refund a payment, fully or partly. Give either charge or payment_intent. Omit amount for a full refund.
            Money moves immediately.
          params_strategy: replace
          params:
            charge:
              type: string
              description: Id of the charge to refund (starts with ch_). Use this or payment_intent.
            payment_intent:
              type: string
              description: Id of the payment intent to refund (starts with pi_). Use this or charge.
            amount:
              type: integer
              description: Amount to refund in the smallest currency unit (e.g. 500 = 5.00 USD). Omit to refund the whole
                remaining amount.
            reason:
              type: string
              enum:
              - duplicate
              - fraudulent
              - requested_by_customer
              description: Why the refund is issued.
          request: |
            {
              "charge": charge,
              "payment_intent": payment_intent,
              "amount": amount,
              "reason": reason
            }
          response: |
            {"id": id, "amount": amount, "currency": currency, "status": status, "reason": reason, "charge": charge, "payment_intent": payment_intent}
