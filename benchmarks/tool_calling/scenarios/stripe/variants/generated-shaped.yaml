servers:
  stripe:
    instructions: |
      Shop billing on Stripe: customers, subscriptions, invoices and refunds.
      Money amounts are integers in the smallest currency unit (cents for USD).
      Ids look like cus_..., sub_..., in_..., ch_..., pi_..., re_.... To find a customer
      by email or name, call get_customers_search before anything else. List and search
      tools return a trimmed summary; call the matching get-by-id tool for full details.
      To page through a list, pass the last returned id as starting_after while has_more is true.
    policy:
      allow:
      - GetCustomers
      - GetCustomersSearch
      - GetCustomersCustomer
      - PostCustomers
      - PostCustomersCustomer
      - GetSubscriptions
      - GetSubscriptionsSearch
      - GetSubscriptionsSubscriptionExposedId
      - PostSubscriptions
      - PostSubscriptionsSubscriptionExposedId
      - DeleteSubscriptionsSubscriptionExposedId
      - PostSubscriptionsSubscriptionPause
      - PostSubscriptionsSubscriptionResume
      - GetInvoices
      - GetInvoicesSearch
      - GetInvoicesInvoice
      - PostInvoices
      - PostInvoicesInvoiceFinalize
      - PostInvoicesInvoicePay
      - PostInvoicesInvoiceSend
      - PostInvoicesInvoiceVoid
      - GetInvoicesInvoiceLines
      - GetRefunds
      - GetRefundsRefund
      - PostRefunds
      - PostRefundsRefundCancel
    operations:
      GetCustomers:
        tool:
          description: List customers, newest first. Filter by exact email. Returns a short summary of each; use get_customers_customer
            for full details.
          response: |
            { "has_more": has_more, "data": [ data.{ "id": id, "name": name, "email": email, "created": created, "currency": currency, "delinquent": delinquent, "balance": balance } ] }
      GetCustomersSearch:
        tool:
          description: Search customers with Stripe query syntax, e.g. email:'jane@example.com' or name~'jane'. Use this to
            find a customer id from an email or name.
          response: |
            { "has_more": has_more, "next_page": next_page, "data": [ data.{ "id": id, "name": name, "email": email, "created": created, "currency": currency, "delinquent": delinquent, "balance": balance } ] }
      GetSubscriptions:
        tool:
          description: List subscriptions, newest first. Filter by customer (cus_...), status (active, past_due, canceled,
            unpaid, trialing, paused, all) or price. Canceled subscriptions are hidden unless status is "all" or "canceled".
          response: |
            { "has_more": has_more, "data": [ data.{ "id": id, "status": status, "customer": customer, "cancel_at_period_end": cancel_at_period_end, "canceled_at": canceled_at, "created": created, "latest_invoice": latest_invoice, "items": [ items.data.{ "price": price.id, "product": price.product, "unit_amount": price.unit_amount, "currency": price.currency, "interval": price.recurring.interval, "quantity": quantity } ] } ] }
      GetSubscriptionsSearch:
        tool:
          description: Search subscriptions with Stripe query syntax, e.g. status:'active' AND metadata['plan']:'pro'.
          response: |
            { "has_more": has_more, "next_page": next_page, "data": [ data.{ "id": id, "status": status, "customer": customer, "cancel_at_period_end": cancel_at_period_end, "created": created, "latest_invoice": latest_invoice } ] }
      DeleteSubscriptionsSubscriptionExposedId:
        tool:
          description: Cancel a subscription immediately. This is irreversible. To cancel at the end of the billing period
            instead, call post_subscriptions_subscription_exposed_id with cancel_at_period_end=true.
      GetInvoices:
        tool:
          description: List invoices, newest first. Filter by customer (cus_...), subscription (sub_...) or status (draft,
            open, paid, uncollectible, void). Returns a short summary of each; use get_invoices_invoice for full details.
          response: |
            { "has_more": has_more, "data": [ data.{ "id": id, "number": number, "status": status, "customer": customer, "subscription": parent.subscription_details.subscription, "currency": currency, "amount_due": amount_due, "amount_paid": amount_paid, "amount_remaining": amount_remaining, "created": created, "due_date": due_date, "hosted_invoice_url": hosted_invoice_url } ] }
      GetInvoicesSearch:
        tool:
          description: Search invoices with Stripe query syntax, e.g. customer:'cus_123' AND status:'open'.
          response: |
            { "has_more": has_more, "next_page": next_page, "data": [ data.{ "id": id, "number": number, "status": status, "customer": customer, "currency": currency, "amount_due": amount_due, "amount_paid": amount_paid, "created": created, "hosted_invoice_url": hosted_invoice_url } ] }
      PostInvoicesInvoiceVoid:
        tool:
          description: Void a finalized (open) invoice so it can no longer be paid. Irreversible. Paid invoices cannot be
            voided; refund them instead.
      PostInvoicesInvoicePay:
        tool:
          description: Attempt to collect payment on an open invoice now, using the customer's default payment method. Charges
            the customer.
      GetRefunds:
        tool:
          description: List refunds, newest first. Filter by charge (ch_...) or payment_intent (pi_...). Returns a short summary
            of each.
          response: |
            { "has_more": has_more, "data": [ data.{ "id": id, "status": status, "amount": amount, "currency": currency, "reason": reason, "charge": charge, "payment_intent": payment_intent, "created": created } ] }
      PostRefunds:
        tool:
          description: Refund a payment, in full or in part. Provide exactly one of payment_intent or charge. Omit amount
            for a full refund; otherwise amount is in the smallest currency unit and cannot exceed what is still refundable.
            Moves real money and cannot be undone once succeeded.
          params_strategy: replace
          params:
            payment_intent:
              type: string
              description: Id of the PaymentIntent to refund (pi_...). Use this or charge.
            charge:
              type: string
              description: Id of the charge to refund (ch_...). Use this or payment_intent.
            amount:
              type: integer
              description: Amount to refund in the smallest currency unit (e.g. 500 = $5.00). Omit to refund the full remaining
                amount.
            reason:
              type: string
              enum:
              - duplicate
              - fraudulent
              - requested_by_customer
              description: Why the refund is issued. Optional.
          request: |
            { "payment_intent": payment_intent, "charge": charge, "amount": amount, "reason": reason }
          response: |
            { "id": id, "status": status, "amount": amount, "currency": currency, "reason": reason, "charge": charge, "payment_intent": payment_intent, "failure_reason": failure_reason, "created": created }
      PostRefundsRefundCancel:
        tool:
          description: Cancel a refund that has not completed yet. Only works for refunds with status requires_action or pending
            on payment methods that support cancelling (e.g. bank transfers).
