      body: {object: list, url: /v1/invoices, has_more: false, data: [*kitchen_supply_open, *kitchen_supply_paid]}
    - server: stripe
      method: GET
      path: /v1/invoices
      query: {customer: cus_KitchenWorks}
      body: {object: list, url: /v1/invoices, has_more: false, data: [*kitchen_works_open]}
    - server: stripe
      method: GET
      path: /v1/invoices
      query: {status: open}
      body: {object: list, url: /v1/invoices, has_more: false, data: [*kitchen_supply_open, *kitchen_works_open]}
    - server: stripe
      method: GET
      path: /v1/invoices
      query: {customer: cus_KitchenSupply, status: open}
      body: {object: list, url: /v1/invoices, has_more: false, data: [*kitchen_supply_open]}
    - server: stripe
      method: GET
      path: /v1/invoices/search
      body: {object: search_result, url: /v1/invoices/search, has_more: false, data: [*kitchen_supply_open, *kitchen_supply_paid]}
    - server: stripe
      method: GET
      path: /v1/invoices/in_1KitchenSupply4471
      body: *kitchen_supply_open
    - server: stripe
      method: GET
      path: /v1/invoices/in_1KitchenSupply4402
      body: *kitchen_supply_paid
    - server: stripe
      method: GET
      path: /v1/invoices/in_1KitchenWorks0090
      body: *kitchen_works_open

