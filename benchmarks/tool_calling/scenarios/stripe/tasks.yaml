- id: stripe-t01
  prompt: >-
    Please cancel the subscription for our customer with the email jane.ortiz@example.com, she asked to stop her plan right away.
  split: dev
  expected_calls:
    # Stripe cancels a subscription by its own endpoint or by the customer's.
    - any_of:
        - server: stripe
          method: DELETE
          path: /v1/subscriptions/{subscription_exposed_id}
          path_parameters: {subscription_exposed_id: sub_1JaneOrtiz}
        - server: stripe
          method: DELETE
          path: /v1/customers/{customer}/subscriptions/{subscription_exposed_id}
          path_parameters: {customer: cus_JaneOrtiz01, subscription_exposed_id: sub_1JaneOrtiz}
  solution:
    - server: stripe
      operation: delete_subscriptions_subscription_exposed_id
      arguments: {subscription_exposed_id: sub_1JaneOrtiz}
  upstream_responses:
    # The customer, by listing, by email, by search, or by id.
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - &jane_ortiz {id: cus_JaneOrtiz01, object: customer, email: jane.ortiz@example.com, name: Jane Ortiz}
          - &jane_orton {id: cus_JaneOrton02, object: customer, email: jane.orton@example.com, name: Jane Orton}
    - server: stripe
      method: GET
      path: /v1/customers
      query: {email: jane.ortiz@example.com}
      body: {object: list, url: /v1/customers, has_more: false, data: [*jane_ortiz]}
    - server: stripe
      method: GET
      path: /v1/customers/search
      body: {object: search_result, url: /v1/customers/search, has_more: false, data: [*jane_ortiz]}
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrtiz01
      body: *jane_ortiz
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrton02
      body: *jane_orton
    # The subscriptions, listed for everyone or one customer, searched, or by id.
    - server: stripe
      method: GET
      path: /v1/subscriptions
      body:
        object: list
        url: /v1/subscriptions
        has_more: false
        data:
          - &sub_jane_ortiz {id: sub_1JaneOrtiz, object: subscription, customer: cus_JaneOrtiz01, status: active}
          - &sub_jane_orton {id: sub_1JaneOrton, object: subscription, customer: cus_JaneOrton02, status: active}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {customer: cus_JaneOrtiz01}
      body: &jane_ortiz_subscriptions
        {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_jane_ortiz]}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {customer: cus_JaneOrton02}
      body: &jane_orton_subscriptions
        {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_jane_orton]}
    - server: stripe
      method: GET
      path: /v1/subscriptions/search
      body: {object: search_result, url: /v1/subscriptions/search, has_more: false, data: [*sub_jane_ortiz]}
    - server: stripe
      method: GET
      path: /v1/subscriptions/sub_1JaneOrtiz
      body: *sub_jane_ortiz
    - server: stripe
      method: GET
      path: /v1/subscriptions/sub_1JaneOrton
      body: *sub_jane_orton
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrtiz01/subscriptions
      body: *jane_ortiz_subscriptions
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrton02/subscriptions
      body: *jane_orton_subscriptions
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrtiz01/subscriptions/sub_1JaneOrtiz
      body: *sub_jane_ortiz
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrton02/subscriptions/sub_1JaneOrton
      body: *sub_jane_orton

