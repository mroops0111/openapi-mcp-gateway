- id: stripe-t01
  prompt: >-
    Please cancel the subscription for our customer with the email jane.ortiz@example.com, she asked to stop her plan right away.
  split: dev
  expected_calls:
    - server: stripe
      method: DELETE
      path: /v1/subscriptions/{subscription_exposed_id}
      path_parameters: {subscription_exposed_id: sub_1JaneOrtiz}
  solution:
    - server: stripe
      operation: delete_subscriptions_subscription_exposed_id
      arguments: {subscription_exposed_id: sub_1JaneOrtiz}
  responses:
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - {id: cus_JaneOrtiz01, object: customer, email: jane.ortiz@example.com, name: Jane Ortiz}
          - {id: cus_JaneOrton02, object: customer, email: jane.orton@example.com, name: Jane Orton}
    - server: stripe
      method: GET
      path: /v1/customers/search
      body:
        object: search_result
        url: /v1/customers/search
        has_more: false
        data:
          - {id: cus_JaneOrtiz01, object: customer, email: jane.ortiz@example.com, name: Jane Ortiz}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      body:
        object: list
        url: /v1/subscriptions
        has_more: false
        data:
          - {id: sub_1JaneOrtiz, object: subscription, customer: cus_JaneOrtiz01, status: active}
          - {id: sub_1JaneOrton, object: subscription, customer: cus_JaneOrton02, status: active}
    - server: stripe
      method: GET
      path: /v1/customers/cus_JaneOrtiz01/subscriptions
      body:
        object: list
        url: /v1/customers/cus_JaneOrtiz01/subscriptions
        has_more: false
        data:
          - {id: sub_1JaneOrtiz, object: subscription, customer: cus_JaneOrtiz01, status: active}

- id: stripe-t02
  prompt: >-
    The open invoice we sent to Kitchen Supply Co (orders@kitchensupply.co) should never have gone out, the order was cancelled. Void it.
  split: dev
  expected_calls:
    - server: stripe
      method: POST
      path: /v1/invoices/{invoice}/void
      path_parameters: {invoice: in_1KitchenSupply4471}
  solution:
    - server: stripe
      operation: post_invoices_invoice_void
      arguments: {invoice: in_1KitchenSupply4471}
  responses:
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - {id: cus_KitchenSupply, object: customer, email: orders@kitchensupply.co, name: Kitchen Supply Co}
          - {id: cus_KitchenWorks, object: customer, email: orders@kitchenworks.co, name: Kitchen Works}
    - server: stripe
      method: GET
      path: /v1/invoices
      body:
        object: list
        url: /v1/invoices
        has_more: false
        data:
          - {id: in_1KitchenSupply4471, object: invoice, customer: cus_KitchenSupply, status: open, amount_due: 21000, currency: usd}
          - {id: in_1KitchenSupply4402, object: invoice, customer: cus_KitchenSupply, status: paid, amount_due: 18000, currency: usd}
          - {id: in_1KitchenWorks0090, object: invoice, customer: cus_KitchenWorks, status: open, amount_due: 9900, currency: usd}

