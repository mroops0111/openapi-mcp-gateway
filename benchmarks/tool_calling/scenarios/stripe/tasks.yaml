- id: stripe-t04
  prompt: >-
    Priya Shah (priya.shah@example.org) returned her order. Refund her most recent payment in full.
  split: test
  expected_calls:
    # Stripe refunds a charge by either of its own endpoints,
    # or by creating a refund for the charge or its payment intent.
    - any_of:
        - server: stripe
          method: POST
          path: /v1/charges/{charge}/refund
          path_parameters: {charge: ch_PriyaRecent}
        - server: stripe
          method: POST
          path: /v1/charges/{charge}/refunds
          path_parameters: {charge: ch_PriyaRecent}
        - server: stripe
          method: POST
          path: /v1/refunds
          body: {charge: ch_PriyaRecent}
        - server: stripe
          method: POST
          path: /v1/refunds
          body: {payment_intent: pi_PriyaRecent}
  solution:
    - server: stripe
      operation: post_charges_charge_refund
      arguments: {charge: ch_PriyaRecent}
  upstream_responses:
    # The customer, by listing, by email, by search, or by id.
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - &priya_shah {id: cus_PriyaShah, object: customer, email: priya.shah@example.org, name: Priya Shah}
          - &priya_shahnaz {id: cus_PriyaShahnaz, object: customer, email: priya.shahnaz@example.org, name: Priya Shahnaz}
    - server: stripe
      method: GET
      path: /v1/customers
      query: {email: priya.shah@example.org}
      body: {object: list, url: /v1/customers, has_more: false, data: [*priya_shah]}
    - server: stripe
      method: GET
      path: /v1/customers/search
      body: {object: search_result, url: /v1/customers/search, has_more: false, data: [*priya_shah]}
    - server: stripe
      method: GET
      path: /v1/customers/cus_PriyaShah
      body: *priya_shah
    - server: stripe
      method: GET
      path: /v1/customers/cus_PriyaShahnaz
      body: *priya_shahnaz
    # The charges, listed for everyone or one customer, searched, or by id.
    - server: stripe
      method: GET
      path: /v1/charges
      body:
        object: list
        url: /v1/charges
        has_more: false
        data:
          - &ch_priya_recent
            {id: ch_PriyaRecent, object: charge, customer: cus_PriyaShah, payment_intent: pi_PriyaRecent, amount: 6400, amount_refunded: 0, currency: usd, created: 1762900000, paid: true, refunded: false, status: succeeded}
          - &ch_priya_older
            {id: ch_PriyaOlder, object: charge, customer: cus_PriyaShah, payment_intent: pi_PriyaOlder, amount: 2900, amount_refunded: 0, currency: usd, created: 1757000000, paid: true, refunded: false, status: succeeded}
          - &ch_shahnaz_recent
            {id: ch_ShahnazRecent, object: charge, customer: cus_PriyaShahnaz, payment_intent: pi_ShahnazRecent, amount: 5100, amount_refunded: 0, currency: usd, created: 1763000000, paid: true, refunded: false, status: succeeded}
    - server: stripe
      method: GET
      path: /v1/charges
      query: {customer: cus_PriyaShah}
      body: {object: list, url: /v1/charges, has_more: false, data: [*ch_priya_recent, *ch_priya_older]}
    - server: stripe
      method: GET
      path: /v1/charges
      query: {customer: cus_PriyaShahnaz}
      body: {object: list, url: /v1/charges, has_more: false, data: [*ch_shahnaz_recent]}
    - server: stripe
      method: GET
      path: /v1/charges/search
      body: {object: search_result, url: /v1/charges/search, has_more: false, data: [*ch_priya_recent, *ch_priya_older]}
    - server: stripe
      method: GET
      path: /v1/charges/ch_PriyaRecent
      body: *ch_priya_recent
    - server: stripe
      method: GET
      path: /v1/charges/ch_PriyaOlder
      body: *ch_priya_older
    - server: stripe
      method: GET
      path: /v1/charges/ch_ShahnazRecent
      body: *ch_shahnaz_recent
    # The same payments as payment intents, each naming its charge.
    - server: stripe
      method: GET
      path: /v1/payment_intents
      body:
        object: list
        url: /v1/payment_intents
        has_more: false
        data:
          - &pi_priya_recent
            {id: pi_PriyaRecent, object: payment_intent, customer: cus_PriyaShah, latest_charge: ch_PriyaRecent, amount: 6400, amount_received: 6400, currency: usd, created: 1762900000, status: succeeded}
          - &pi_priya_older
            {id: pi_PriyaOlder, object: payment_intent, customer: cus_PriyaShah, latest_charge: ch_PriyaOlder, amount: 2900, amount_received: 2900, currency: usd, created: 1757000000, status: succeeded}
          - &pi_shahnaz_recent
            {id: pi_ShahnazRecent, object: payment_intent, customer: cus_PriyaShahnaz, latest_charge: ch_ShahnazRecent, amount: 5100, amount_received: 5100, currency: usd, created: 1763000000, status: succeeded}
    - server: stripe
      method: GET
      path: /v1/payment_intents
      query: {customer: cus_PriyaShah}
      body: {object: list, url: /v1/payment_intents, has_more: false, data: [*pi_priya_recent, *pi_priya_older]}
    - server: stripe
      method: GET
      path: /v1/payment_intents
      query: {customer: cus_PriyaShahnaz}
      body: {object: list, url: /v1/payment_intents, has_more: false, data: [*pi_shahnaz_recent]}
    - server: stripe
      method: GET
      path: /v1/payment_intents/search
      body: {object: search_result, url: /v1/payment_intents/search, has_more: false, data: [*pi_priya_recent, *pi_priya_older]}
    - server: stripe
      method: GET
      path: /v1/payment_intents/pi_PriyaRecent
      body: *pi_priya_recent
    - server: stripe
      method: GET
      path: /v1/payment_intents/pi_PriyaOlder
      body: *pi_priya_older
    - server: stripe
      method: GET
      path: /v1/payment_intents/pi_ShahnazRecent
      body: *pi_shahnaz_recent
    # Nothing is refunded yet, and her payments were one-off charges with no invoice.
    - server: stripe
      method: GET
      path: /v1/refunds
      body: {object: list, url: /v1/refunds, has_more: false, data: []}
    - server: stripe
      method: GET
      path: /v1/charges/{charge}/refunds
      body: {object: list, url: /v1/refunds, has_more: false, data: []}
    - server: stripe
      method: GET
      path: /v1/invoices
      body: {object: list, url: /v1/invoices, has_more: false, data: []}
    - server: stripe
      method: GET
      path: /v1/invoices/search
      body: {object: search_result, url: /v1/invoices/search, has_more: false, data: []}

- id: stripe-t05
  prompt: >-
    Tom Becker (tom.becker@example.net) paused his coffee subscription last month and wants it running again. Please resume it.
  split: test
  expected_calls:
    - server: stripe
      method: POST
      path: /v1/subscriptions/{subscription}/resume
      path_parameters: {subscription: sub_TomPaused}
  solution:
    - server: stripe
      operation: post_subscriptions_subscription_resume
      arguments: {subscription: sub_TomPaused}
  upstream_responses:
    # The customer, by listing, by email, by search, or by id.
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - &tom_becker {id: cus_TomBecker, object: customer, email: tom.becker@example.net, name: Tom Becker}
          - &tom_baker {id: cus_TomBaker, object: customer, email: tom.baker@example.net, name: Tom Baker}
    - server: stripe
      method: GET
      path: /v1/customers
      query: {email: tom.becker@example.net}
      body: {object: list, url: /v1/customers, has_more: false, data: [*tom_becker]}
    - server: stripe
      method: GET
      path: /v1/customers/search
      body: {object: search_result, url: /v1/customers/search, has_more: false, data: [*tom_becker]}
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBecker
      body: *tom_becker
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBaker
      body: *tom_baker
    # The subscriptions, listed for everyone, one customer, or one status, searched, or by id.
    # The paused one is paused by status, not by pause_collection, so resuming it is the way back.
    - server: stripe
      method: GET
      path: /v1/subscriptions
      body:
        object: list
        url: /v1/subscriptions
        has_more: false
        data:
          - &sub_tom_active
            {id: sub_TomActive, object: subscription, customer: cus_TomBecker, status: active, pause_collection: null, description: Tea of the month}
          - &sub_tom_paused
            {id: sub_TomPaused, object: subscription, customer: cus_TomBecker, status: paused, pause_collection: null, description: Coffee club}
          - &sub_baker_paused
            {id: sub_BakerPaused, object: subscription, customer: cus_TomBaker, status: paused, pause_collection: null, description: Coffee club}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {customer: cus_TomBecker}
      body: &tom_becker_subscriptions
        {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_tom_active, *sub_tom_paused]}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {customer: cus_TomBaker}
      body: &tom_baker_subscriptions
        {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_baker_paused]}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {status: paused}
      body: {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_tom_paused, *sub_baker_paused]}
    - server: stripe
      method: GET
      path: /v1/subscriptions
      query: {customer: cus_TomBecker, status: paused}
      body: {object: list, url: /v1/subscriptions, has_more: false, data: [*sub_tom_paused]}
    - server: stripe
      method: GET
      path: /v1/subscriptions/search
      body: {object: search_result, url: /v1/subscriptions/search, has_more: false, data: [*sub_tom_active, *sub_tom_paused]}
    - server: stripe
      method: GET
      path: /v1/subscriptions/sub_TomActive
      body: *sub_tom_active
    - server: stripe
      method: GET
      path: /v1/subscriptions/sub_TomPaused
      body: *sub_tom_paused
    - server: stripe
      method: GET
      path: /v1/subscriptions/sub_BakerPaused
      body: *sub_baker_paused
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBecker/subscriptions
      body: *tom_becker_subscriptions
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBaker/subscriptions
      body: *tom_baker_subscriptions
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBecker/subscriptions/sub_TomActive
      body: *sub_tom_active
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBecker/subscriptions/sub_TomPaused
      body: *sub_tom_paused
    - server: stripe
      method: GET
      path: /v1/customers/cus_TomBaker/subscriptions/sub_BakerPaused
      body: *sub_baker_paused

