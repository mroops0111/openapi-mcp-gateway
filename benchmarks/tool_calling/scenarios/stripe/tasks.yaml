    - server: stripe
      method: GET
      path: /v1/customers/cus_KitchenWorks
      body: *kitchen_works
    # The invoices, listed for everyone, one customer, or one status, searched, or by id.
    - server: stripe
      method: GET
      path: /v1/invoices
      body:
        object: list
        url: /v1/invoices
