- id: stripe-t04
  prompt: >-
    Priya Shah (priya.shah@example.org) returned her order. Refund her most recent payment in full.
  split: test
  expected_calls:
    # Stripe refunds a charge by its own endpoint or by creating a refund for it.
    - any_of:
        - server: stripe
          method: POST
          path: /v1/charges/{charge}/refund
          path_parameters: {charge: ch_PriyaRecent}
        - server: stripe
          method: POST
          path: /v1/refunds
          body: {charge: ch_PriyaRecent}
  solution:
    - server: stripe
      operation: post_charges_charge_refund
      arguments: {charge: ch_PriyaRecent}
  responses:
    - server: stripe
      method: GET
      path: /v1/customers
      body:
        object: list
        url: /v1/customers
        has_more: false
        data:
          - {id: cus_PriyaShah, object: customer, email: priya.shah@example.org, name: Priya Shah}
          - {id: cus_PriyaShahnaz, object: customer, email: priya.shahnaz@example.org, name: Priya Shahnaz}
    - server: stripe
      method: GET
      path: /v1/customers/search
      body:
        object: search_result
        url: /v1/customers/search
        has_more: false
        data:
          - {id: cus_PriyaShah, object: customer, email: priya.shah@example.org, name: Priya Shah}
    - server: stripe
      method: GET
      path: /v1/charges
      body:
        object: list
        url: /v1/charges
        has_more: false
        data:
          - {id: ch_PriyaRecent, object: charge, customer: cus_PriyaShah, amount: 6400, currency: usd, created: 1762900000, paid: true, refunded: false, status: succeeded}
          - {id: ch_PriyaOlder, object: charge, customer: cus_PriyaShah, amount: 2900, currency: usd, created: 1757000000, paid: true, refunded: false, status: succeeded}
          - {id: ch_ShahnazRecent, object: charge, customer: cus_PriyaShahnaz, amount: 5100, currency: usd, created: 1763000000, paid: true, refunded: false, status: succeeded}

