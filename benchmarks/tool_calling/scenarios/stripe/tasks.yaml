          - &kitchen_works_open
            {id: in_1KitchenWorks0090, object: invoice, customer: cus_KitchenWorks, customer_email: orders@kitchenworks.co, customer_name: Kitchen Works, status: open, amount_due: 9900, currency: usd}
    - server: stripe
