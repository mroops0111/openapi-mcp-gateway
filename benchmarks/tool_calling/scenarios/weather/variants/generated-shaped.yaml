servers:
  weather:
    instructions: |
      US National Weather Service data for outdoor-event locations (US only).
      Workflow: call get_location with the venue's latitude and longitude first. It returns
      gridId, gridX and gridY, which the forecast tools and get_nearby_stations need.
      - Forecast: get_forecast (12-hour periods, about 7 days) or get_hourly_forecast (next 48 hours).
      - Current conditions: get_nearby_stations (nearest first), then get_current_conditions with a stationId.
      - Weather alerts: get_active_alerts with the venue's latitude and longitude. It needs no get_location call.
      Use latitude and longitude as decimal degrees with at most 4 decimals; longitude is negative in the US.
    policy:
      allow:
      - point
      - gridpoint_forecast
      - gridpoint_forecast_hourly
      - gridpoint_stations
      - station_observation_latest
      - alerts_active
    operations:
      point:
        tool:
          name: get_location
          description: Look up a US venue by latitude/longitude. Returns the forecast grid (gridId, gridX, gridY) needed by
            get_forecast, get_hourly_forecast and get_nearby_stations, plus the city, time zone and forecast zone. Call this
            first for any new venue.
          response: |
            (
              $p := properties ? properties : $;
              {
                "gridId": $p.gridId,
                "gridX": $p.gridX,
                "gridY": $p.gridY,
                "city": $p.relativeLocation.properties.city,
                "state": $p.relativeLocation.properties.state,
                "timeZone": $p.timeZone,
                "forecastZone": $p.forecastZone,
                "county": $p.county
              }
            )
      gridpoint_forecast:
        tool:
          name: get_forecast
          description: Multi-day forecast in 12-hour periods (day and night, about 7 days) for a venue. Use the gridId, gridX
            and gridY returned by get_location.
          params_strategy: replace
          params:
            gridId:
              type: string
              description: Forecast office ID from get_location, e.g. "TOP".
            gridX:
              type: integer
              description: Grid X coordinate from get_location.
            gridY:
              type: integer
              description: Grid Y coordinate from get_location.
            units:
              type: string
              enum:
              - us
              - si
              default: us
              description: us for Fahrenheit and mph, si for Celsius and km/h.
          request: |
            { "wfo": gridId, "x": gridX, "y": gridY, "units": units }
          response: |
            (
              $p := properties ? properties : $;
              {
                "updated": $p.updateTime,
                "periods": [$p.periods.{
                  "name": name,
                  "start": startTime,
                  "end": endTime,
                  "temperature": temperature,
                  "temperatureUnit": temperatureUnit,
                  "chanceOfPrecipitationPercent": probabilityOfPrecipitation.value,
                  "wind": windSpeed & " " & windDirection,
                  "summary": shortForecast,
                  "details": detailedForecast
                }]
              }
            )
      gridpoint_forecast_hourly:
        tool:
          name: get_hourly_forecast
          description: Hour-by-hour forecast for the next 48 hours for a venue. Use the gridId, gridX and gridY returned by
            get_location. Good for picking a start time or deciding on a weather delay.
          params_strategy: replace
          params:
            gridId:
              type: string
              description: Forecast office ID from get_location, e.g. "TOP".
            gridX:
              type: integer
              description: Grid X coordinate from get_location.
            gridY:
              type: integer
              description: Grid Y coordinate from get_location.
            units:
              type: string
              enum:
              - us
              - si
              default: us
              description: us for Fahrenheit and mph, si for Celsius and km/h.
          request: |
            { "wfo": gridId, "x": gridX, "y": gridY, "units": units }
          response: |
            (
              $p := properties ? properties : $;
              {
                "updated": $p.updateTime,
                "hours": [$p.periods[[0..47]].{
                  "start": startTime,
                  "temperature": temperature,
                  "temperatureUnit": temperatureUnit,
                  "chanceOfPrecipitationPercent": probabilityOfPrecipitation.value,
                  "humidityPercent": relativeHumidity.value,
                  "wind": windSpeed & " " & windDirection,
                  "summary": shortForecast
                }]
              }
            )
      gridpoint_stations:
        tool:
          name: get_nearby_stations
          description: List the nearest weather observation stations to a venue, closest first. Pass a stationId from the
            result to get_current_conditions. Use the gridId, gridX and gridY from get_location.
          params_strategy: replace
          params:
            gridId:
              type: string
              description: Forecast office ID from get_location, e.g. "TOP".
            gridX:
              type: integer
              description: Grid X coordinate from get_location.
            gridY:
              type: integer
              description: Grid Y coordinate from get_location.
          request: |
            { "wfo": gridId, "x": gridX, "y": gridY, "limit": 5 }
          response: |
            (
              $s := features ? features.properties : `@graph`;
              { "stations": [$s.{ "stationId": stationIdentifier, "name": name }] }
            )
      station_observation_latest:
        tool:
          name: get_current_conditions
          description: Latest observed conditions (temperature, wind, humidity, sky, precipitation) at a weather station.
            Get the stationId from get_nearby_stations. Values are metric as reported by the station.
          params_strategy: replace
          params:
            stationId:
              type: string
              description: Station ID from get_nearby_stations, e.g. "KTOP".
          request: |
            { "stationId": stationId }
          response: |
            (
              $p := properties ? properties : $;
              $q := function($v){ $v.value != null ? { "value": $v.value, "unit": $v.unitCode } };
              {
                "station": $p.stationName,
                "observedAt": $p.timestamp,
                "conditions": $p.textDescription,
                "temperature": $q($p.temperature),
                "heatIndex": $q($p.heatIndex),
                "windChill": $q($p.windChill),
                "wind": $q($p.windSpeed),
                "windGust": $q($p.windGust),
                "windDirectionDegrees": $q($p.windDirection),
                "relativeHumidity": $q($p.relativeHumidity),
                "visibility": $q($p.visibility),
                "precipitationLastHour": $q($p.precipitationLastHour)
              }
            )
      alerts_active:
        tool:
          name: get_active_alerts
          description: Currently active weather alerts (warnings, watches, advisories) that cover a venue's latitude/longitude.
            An empty list means no active alerts there.
          params_strategy: replace
          params:
            latitude:
              type: number
              description: Venue latitude in decimal degrees, e.g. 39.0473.
            longitude:
              type: number
              description: Venue longitude in decimal degrees, negative in the US, e.g. -95.6752.
          request: |
            { "point": $string(latitude) & "," & $string(longitude), "status": ["actual"] }
          response: |
            (
              $a := features ? features.properties : `@graph`;
              {
                "count": $count($a),
                "alerts": [$a.{
                  "event": event,
                  "severity": severity,
                  "urgency": urgency,
                  "certainty": certainty,
                  "headline": headline,
                  "area": areaDesc,
                  "onset": onset,
                  "ends": ends,
                  "expires": expires,
                  "description": description,
                  "instruction": instruction
                }]
              }
            )
