servers:
  weather:
    instructions: |
      US National Weather Service data for outdoor event locations.
      Start with `point` (latitude, longitude) to get the forecast grid, nearby
      observation stations and county/forecast zone. Then use gridpoint_forecast or
      gridpoint_forecast_hourly for the forecast, gridpoint_stations followed by
      station_observation_latest for current conditions, and alerts_active
      (with the `point` argument as "lat,lon") for active weather alerts.
    policy:
      allow:
      - point
      - gridpoint_forecast
      - gridpoint_forecast_hourly
      - gridpoint_stations
      - station_observation_latest
      - alerts_active
      - alerts_active_zone
      - alerts_active_area
      - alerts_single
