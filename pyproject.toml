[project]
name = "openapi-mcp-gateway"
version = "0.1.0"
description = "Turn any OpenAPI specification into a Model Context Protocol (MCP) server with a single command."
authors = [
    {name = "YunTai Yang"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["mcp", "openapi", "ai", "llm", "gateway"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "mcp[cli]>=1.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
    "inflection>=0.5.1",
    "click>=8.0.0",
]

[project.optional-dependencies]
redis = ["redis>=6.2.0"]

[project.scripts]
openapi-mcp-gateway = "openapi_mcp_gateway.cli:main"

[project.urls]
Homepage = "https://github.com/mroops-com/openapi-mcp-gateway"
Repository = "https://github.com/mroops-com/openapi-mcp-gateway"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_mcp_gateway"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "S104",   # use of binding
    "T201",   # print statements
    "B008",   # do not perform function calls in argument defaults
    "RUF012", # mutable class attributes should be annotated with ClassVar
]

fixable = ["ALL"]
unfixable = []

exclude = [
    ".git",
    ".venv",
    "node_modules",
    "venv",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.isort]
known-first-party = ["openapi_mcp_gateway"]
force-single-line = false
lines-after-imports = 2
split-on-trailing-comma = true

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
