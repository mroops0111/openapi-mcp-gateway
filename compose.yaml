# The gateway with Redis as the shared token store.
#
# Put your config at ./config.yml; it is mounted at /config/config.yml.
# To share tokens through Redis, set in it:
#   store:
#     type: redis
#     redis_url: redis://redis:6379
#
# `docker compose up` pulls the published image.
# To run from source instead: `uv build --wheel && docker compose up --build`.

services:
  gateway:
    image: ghcr.io/mroops0111/openapi-mcp-gateway:latest
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./config.yml:/config/config.yml:ro
    # Secrets the config references as ${ENV_VAR}.
    # environment:
    #   GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
