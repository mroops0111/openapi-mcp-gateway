name: Docs

on:
  push:
    branches: [master]
    paths: [docs/**, zensical.toml, .github/workflows/docs.yml]
  pull_request:
    branches: [master]
    paths: [docs/**, zensical.toml, .github/workflows/docs.yml]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Strict mode fails the build on a broken link or anchor, so a pull request catches it before the site does.
      - run: uvx --with markdown-callouts==0.4.0 zensical==0.1.3 build --strict --clean
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
