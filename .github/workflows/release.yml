name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gateway and its eval release together at one version, each requiring the other at exactly that version.
      - name: Verify tag matches both packages' versions
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import sys, tomllib
          tag = sys.argv[1]
          gateway = tomllib.load(open('pyproject.toml', 'rb'))['project']
          evaluation = tomllib.load(open('eval/pyproject.toml', 'rb'))['project']
          found = {
              'pyproject.toml version': gateway['version'],
              'eval/pyproject.toml version': evaluation['version'],
              'the eval extra': gateway['optional-dependencies']['eval'][0].split('==')[1],
              "eval's gateway requirement": evaluation['dependencies'][0].split('==')[1],
          }
          wrong = [f'{place} is {version}' for place, version in found.items() if version != tag]
          if wrong:
              sys.exit(f'::error::Tag v{tag} does not match: ' + ', '.join(wrong))
          PY

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv build --all-packages

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openapi-mcp-gateway
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-image:
    name: Publish Image
    # After PyPI, so `latest` never names a version pip cannot install.
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The image installs the same wheel that went to PyPI.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # PEP 440 rather than semver, since the tag is the Python version.
          # A pre-release such as 1.2.0rc1 gets only its own tag, and `latest` only follows a final release.
          tags: |
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: GitHub Release
    # Waits for the image too, so a release never announces an image that failed to publish.
    needs: [publish-pypi, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # A PEP 440 pre-release or dev release is marked as one, so it never becomes the repo's latest release.
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME#v}" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}" \
            dist/*
