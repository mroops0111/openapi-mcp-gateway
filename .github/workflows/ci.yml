name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev --extra redis
      - run: uv run ruff check src/ tests/ eval/
      - run: uv run ruff format --check src/ tests/ eval/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev --extra redis
      - run: uv run basedpyright src/ tests/ eval/src/ eval/tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-packages --extra dev --extra redis
      # Fails below the coverage floor set under [tool.coverage.report] in pyproject.toml.
      - run: uv run pytest tests/ -v --tb=short --cov
      - run: uv run pytest eval/tests/ -v --tb=short

  smoke:
    name: Smoke (External Deps)
    runs-on: ubuntu-latest
    # Hits the live FastAPI repo + public OpenAPI spec URLs (Petstore, GitHub,
    # Asana). Network-dependent — failures here often mean a third-party URL
    # is down, not a real regression. Investigate before assuming a bug.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra dev --extra redis
      - run: uv run pytest -m smoke -v --tb=short

  search-ranking-benchmark:
    name: Search Ranking Benchmark
    runs-on: ubuntu-latest
    # Checks the committed data, ranks its queries through search_operations, and fails below the gate scores.
    # It calls no model. The pinned specs download once and are cached by their checksums.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/openapi-mcp-gateway/specs
          key: benchmark-specs-${{ hashFiles('eval/**/benchmark.yaml') }}
      - run: uv sync --all-packages --extra dev --extra redis
      - run: uv run omgw benchmark search-ranking check

  tool-calling-benchmark:
    name: Tool Calling Benchmark
    runs-on: ubuntu-latest
    # Proves every tool calling benchmark task passes with its solution and every hand-written variant reaches it.
    # It calls no model, so it needs no API key. The pinned specs download once and are cached by their checksums.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/openapi-mcp-gateway/specs
          key: benchmark-specs-${{ hashFiles('eval/**/benchmark.yaml') }}
      - run: uv sync --all-packages --extra dev --extra redis
      - run: uv run omgw benchmark tool-calling check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
