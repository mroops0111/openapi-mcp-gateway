name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra redis
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra redis
      - run: uv run basedpyright src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra redis
      - run: uv run pytest tests/ -v --tb=short

  smoke:
    name: Smoke (External Deps)
    runs-on: ubuntu-latest
    # Hits the live FastAPI repo + public OpenAPI spec URLs (Petstore, GitHub,
    # Asana). Network-dependent — failures here often mean a third-party URL
    # is down, not a real regression. Investigate before assuming a bug.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra redis
      - run: uv run pytest -m smoke -v --tb=short

  search-benchmark:
    name: Search Benchmark
    runs-on: ubuntu-latest
    # Ranks the committed queries through search_operations and fails below evals/search/baseline.json.
    # It calls no model. The pinned specs download once and are cached by their checksums.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/openapi-mcp-gateway/specs
          key: benchmark-specs-${{ hashFiles('evals/**/benchmark.yaml') }}
      - run: uv sync --extra dev --extra redis
      - run: uv run python -m openapi_mcp_gateway.evals search validate evals/search
      - run: uv run python -m openapi_mcp_gateway.evals search check evals/search

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
