servers:
  discord:
    instructions: |
      Moderation tools for one Discord community server, acting as a bot.
      Ids are numeric snowflake strings. Start with list_guild_channels or
      list_guild_roles to find channel and role ids, and search_guild_members
      to find a user id by name. Destructive tools (delete_channel,
      delete_guild_role, delete_message, bulk_delete_messages, delete_guild_member
      which kicks, ban_user_from_guild) cannot be undone: confirm the target first.
    policy:
      allow:
      - list_guild_members
      - search_guild_members
      - get_guild_member
      - update_guild_member
      - delete_guild_member
      - list_guild_bans
      - get_guild_ban
      - ban_user_from_guild
      - unban_user_from_guild
      - list_guild_roles
      - get_guild_role
      - create_guild_role
      - update_guild_role
      - delete_guild_role
      - add_guild_member_role
      - delete_guild_member_role
      - list_guild_channels
      - get_channel
      - create_guild_channel
      - update_channel
      - delete_channel
      - list_messages
      - get_message
      - create_message
      - delete_message
      - bulk_delete_messages
      - list_pins
      - create_pin
      - delete_pin
    operations:
      list_guild_members:
        tool:
          params_strategy: merge
          params:
            limit:
              default: 50
              description: How many members to return (1-1000). Page forward with `after` set to the last user id returned.
          response: |
            [ $.{
              "user_id": user.id,
              "username": user.username,
              "display_name": nick ? nick : user.global_name,
              "is_bot": user.bot,
              "roles": roles,
              "joined_at": joined_at,
              "timed_out_until": communication_disabled_until
            } ]
      search_guild_members:
        tool:
          response: |
            [ $.{
              "user_id": user.id,
              "username": user.username,
              "display_name": nick ? nick : user.global_name,
              "is_bot": user.bot,
              "roles": roles,
              "joined_at": joined_at,
              "timed_out_until": communication_disabled_until
            } ]
      get_guild_member:
        tool:
          response: |
            {
              "user_id": user.id,
              "username": user.username,
              "display_name": nick ? nick : user.global_name,
              "is_bot": user.bot,
              "roles": roles,
              "joined_at": joined_at,
              "timed_out_until": communication_disabled_until
            }
      list_messages:
        tool:
          params_strategy: merge
          params:
            limit:
              default: 25
              description: How many messages to return (1-100), newest first. Page back in time with `before` set to the oldest
                message id returned.
          response: |
            [ $.{
              "id": id,
              "author_id": author.id,
              "author": author.username,
              "content": content,
              "timestamp": timestamp,
              "edited_timestamp": edited_timestamp,
              "pinned": pinned,
              "attachments": attachments.filename
            } ]
      get_message:
        tool:
          response: |
            {
              "id": id,
              "channel_id": channel_id,
              "author_id": author.id,
              "author": author.username,
              "content": content,
              "timestamp": timestamp,
              "edited_timestamp": edited_timestamp,
              "pinned": pinned,
              "attachments": attachments.filename
            }
      ban_user_from_guild:
        tool:
          params_strategy: merge
          params:
            delete_message_seconds:
              description: Also delete this many seconds of the user's recent messages (0-604800, so up to 7 days). Omit to
                keep their messages.
