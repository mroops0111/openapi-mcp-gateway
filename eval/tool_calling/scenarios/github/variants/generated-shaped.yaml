servers:
  github:
    instructions: |
      Use for triaging issues and reviewing pull requests in GitHub repositories.
      Every tool needs `owner` and `repo`. Start with issues/list-for-repo or pulls/list.
      GitHub treats pull requests as issues, so issue lists can include PRs
      (`is_pull_request: true`); use the pulls/* tools for PR diffs and reviews.
    policy:
      allow:
      - issues/list-for-repo
      - issues/get
      - issues/create
      - issues/update
      - issues/list-comments
      - issues/create-comment
      - issues/list-labels-for-repo
      - issues/add-labels
      - issues/remove-label
      - issues/list-assignees
      - issues/add-assignees
      - pulls/list
      - pulls/get
      - pulls/list-files
      - pulls/list-commits
      - pulls/list-reviews
      - pulls/list-review-comments
      - pulls/list-requested-reviewers
      - pulls/request-reviewers
      - pulls/create-review
    operations:
      issues/list-for-repo:
        tool:
          params_strategy: merge
          params:
            per_page:
              default: 30
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "author": user.login,
              "labels": [labels.name],
              "assignees": [assignees.login],
              "comments": comments,
              "is_pull_request": $exists(pull_request),
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            } ]
      pulls/list:
        tool:
          params_strategy: merge
          params:
            per_page:
              default: 30
          response: |
            [ $.{
              "number": number,
              "title": title,
              "state": state,
              "draft": draft,
              "author": user.login,
              "head": head.ref,
              "base": base.ref,
              "labels": [labels.name],
              "requested_reviewers": [requested_reviewers.login],
              "created_at": created_at,
              "updated_at": updated_at,
              "url": html_url
            } ]
