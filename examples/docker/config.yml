# Config for examples/docker/docker-compose.yml, mounted at /config/config.yml.
# The store points at the compose Redis service, so tokens survive a gateway restart
# and are shared when the gateway runs as several replicas.

host: "0.0.0.0"
port: 8000
url: http://localhost:8000   # public-facing URL (used for OAuth callback discovery)
transport: streamable-http

store:
  type: redis
  redis_url: redis://redis:6379
  key_prefix: mcp_gw

servers:
  - name: petstore
    spec: https://petstore3.swagger.io/api/v3/openapi.json
