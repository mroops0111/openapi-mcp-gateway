# GitHub REST API exposed via dynamic meta-tools.
#
# GitHub's OpenAPI spec carries 1,000+ operations,
# and registering each as its own MCP tool overflows most LLM context windows on connect.
# With `exposure.style: dynamic` the client sees only three meta-tools,
# and the LLM walks search -> get -> call to pick operations on demand.
#
# Prerequisites:
#   1. Create a PAT: https://github.com/settings/tokens
#   2. export GITHUB_TOKEN="ghp_..."
#
# Usage: openapi-mcp-gateway serve --config examples/github-dynamic.yml

host: "0.0.0.0"
port: 8000
transport: streamable-http

servers:
  - name: github
    spec: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
    exposure:
      style: dynamic
      # Optional: reweigh how search_operations ranks operations, field by field.
      # Unset fields keep their defaults (summary 3, name 2, description 0.5, path 0.5, tags 0.5).
      # search:
      #   field_weights:
      #     description: 1
    # GitHub's description declares no security scheme, so the server declares the bearer token GitHub takes.
    security_schemes:
      token:
        type: http
        scheme: bearer
    security:
      - token: []
    auth:
      upstream:
        credentials:
          token:
            value: ${GITHUB_TOKEN}
