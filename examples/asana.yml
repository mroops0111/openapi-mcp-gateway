# Asana — OAuth2 authorization code flow.
# The gateway auto-detects authorizationUrl / tokenUrl from the spec's securitySchemes.
#
# Prerequisites:
#   1. Create an Asana app: https://app.asana.com/0/my-apps
#   2. Add redirect URL: http://127.0.0.1:8000/asana/auth/callback
#   3. export ASANA_CLIENT_ID="..." ASANA_CLIENT_SECRET="..."
#
# Usage: openapi-mcp-gateway --config examples/asana.yml

host: "0.0.0.0"
port: 8000
transport: streamable-http

servers:
  - name: asana
    spec: https://raw.githubusercontent.com/Asana/openapi/master/defs/asana_oas.yaml
    auth:
      type: oauth2
      client_id: ${ASANA_CLIENT_ID}
      client_secret: ${ASANA_CLIENT_SECRET}
      scopes:
        - openid
        - email
        - profile
        - users:read
        - workspaces:read
