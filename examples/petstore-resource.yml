# Petstore Resource Exposure Demo
#
# Two operations are opted into MCP resource exposure via
# `x-mcp-integration.expose.resource` in the spec:
#   - GET /pet/{petId}      -> resource template petstore://pet/{petId}
#   - GET /store/inventory  -> resource template petstore://store/inventory
# The remaining GET (findPetsByStatus) stays a regular tool.
#
# Usage (run from the repo root):
#   uv run openapi-mcp-gateway --config examples/petstore-resource.yml
#
# Then connect MCP Inspector to http://127.0.0.1:8000/petstore/mcp:
#   npx @modelcontextprotocol/inspector
# Open the "Resource Templates" tab, fill petId, click Read.

host: "127.0.0.1"
port: 8000
transport: streamable-http

servers:
  - name: petstore
    spec: ./examples/petstore-resource.json
