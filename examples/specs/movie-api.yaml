openapi: 3.1.0
info:
  title: The Movie Database
  version: "3"
# The raw upstream surface, pointed at as-is. The friendly tool interface is declared
# entirely in examples/movie-shaping.yml, so this file is never edited to shape a tool.
paths:
  /discover/movie:
    get:
      operationId: discover_movies
      summary: Discover movies.
      parameters:
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: include_adult
          in: query
          required: false
          schema:
            type: boolean
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of movies.
  /movie/{movie_id}:
    get:
      operationId: get_movie_details
      summary: Get the details of one movie.
      parameters:
        - name: movie_id
          in: path
          required: true
          schema:
            type: integer
        - name: append_to_response
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The movie.
