[project]
site_name = "openapi-mcp-gateway"
site_description = "Mount any OpenAPI spec as an MCP server, with per-API auth and tool shaping, from one YAML file."
site_url = "https://mroops0111.github.io/openapi-mcp-gateway/"
repo_url = "https://github.com/mroops0111/openapi-mcp-gateway"
repo_name = "mroops0111/openapi-mcp-gateway"
edit_uri = "edit/master/docs/"
copyright = "MIT License"
extra_css = ["stylesheets/brand.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Guides" = [
    { "Authoring With AI" = "guides/authoring-with-ai.md" },
    { "Exposure" = "guides/exposure.md" },
    { "Tool Shaping" = "guides/tool-shaping.md" },
    { "Authorization" = "guides/authorization.md" },
    { "Scopes" = "guides/scopes.md" },
    { "Identity Providers" = "guides/identity-providers.md" },
    { "Deployment" = "guides/deployment.md" },
    { "Python and FastAPI" = "guides/python.md" },
  ] },
  { "Concepts" = [
    { "Architecture" = "concepts/architecture.md" },
    { "Security" = "concepts/security.md" },
    { "Context Efficiency" = "concepts/context-efficiency.md" },
    { "Scope Model" = "concepts/scope-model.md" },
    { "Token Lifecycle" = "concepts/token-lifecycle.md" },
    { "Dynamic Exposure" = "concepts/dynamic-exposure.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "CLI" = "reference/cli.md" },
  ] },
  { "Evaluation" = "evaluation.md" },
]

[project.theme]
logo = "assets/icon.svg"
favicon = "assets/icon.svg"
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true

# GitHub's "> [!NOTE]" alerts, so a callout reads the same on GitHub and on the site.
[project.markdown_extensions.github-callouts]
